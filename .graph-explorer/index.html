<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictionary of Distributed Systems — Graph</title>
    <style>
      :root {
        --bg: #edede9;
        --panel: #f5f5f1;
        --ink: #1c1c1a;
        --muted: #6d6d68;
        --line: #d4d4cf;
        --mono:
          ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 var(--sans);
        overflow: hidden;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      #app {
        display: flex;
        height: 100dvh;
      }
      #stage {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }
      #graph {
        position: absolute;
        inset: 0;
      }

      .round {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
      }
      .round:hover {
        border-color: var(--ink);
      }
      .round svg {
        width: 16px;
        height: 16px;
      }

      #top-left {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #brand {
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #info-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 3;
        font-family: var(--mono);
        font-size: 13px;
      }
      #hint {
        position: absolute;
        bottom: 16px;
        left: 18px;
        z-index: 2;
        margin: 0;
        font: 12px var(--mono);
        color: var(--muted);
        pointer-events: none;
      }

      .popover {
        position: absolute;
        top: 66px;
        z-index: 4;
        width: min(360px, calc(100% - 36px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.1);
      }
      #search {
        left: 18px;
        overflow: hidden;
      }
      #search input {
        width: 100%;
        padding: 12px 14px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        font: 15px var(--sans);
        color: var(--ink);
        outline: none;
      }
      #results {
        max-height: min(55vh, 420px);
        margin: 0;
        padding: 4px;
        overflow-y: auto;
        list-style: none;
      }
      #results li {
        padding: 7px 10px;
        border-radius: 7px;
        cursor: pointer;
      }
      #results li[aria-selected="true"] {
        background: var(--ink);
        color: var(--panel);
      }
      #results small {
        display: block;
        overflow: hidden;
        font-size: 12px;
        opacity: 0.7;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #results .none {
        color: var(--muted);
        cursor: default;
      }
      #info {
        right: 18px;
        padding: 16px 18px;
        font-size: 14px;
      }
      #info h2 {
        margin: 0 0 6px;
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      #info p {
        margin: 0 0 8px;
      }
      #info p:last-child {
        margin-bottom: 0;
      }
      kbd {
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: 12px var(--mono);
      }

      #panel {
        position: relative;
        flex: 0 0 var(--panel-width, min(560px, 42vw));
        height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--line);
      }
      #resizer {
        position: relative;
        z-index: 5;
        flex: 0 0 11px;
        margin: 0 -6px 0 -5px;
        cursor: col-resize;
        touch-action: none;
      }
      #resizer::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 4px;
        width: 3px;
        background: transparent;
        transition: background 0.12s;
      }
      #resizer:hover::after,
      #resizer:focus-visible::after,
      .resizing #resizer::after {
        background: var(--ink);
      }
      #resizer:focus-visible {
        outline: none;
      }
      .resizing {
        cursor: col-resize;
        user-select: none;
      }
      #close {
        position: sticky;
        top: 16px;
        z-index: 2;
        float: right;
        margin: 16px 16px 0 0;
        font-size: 18px;
        line-height: 1;
      }
      #panel-body {
        padding: 30px 30px 44px;
      }
      .eyebrow,
      .label {
        font: 11px var(--mono);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #panel h1 {
        margin: 6px 48px 12px 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
        outline: none;
      }
      .lede {
        margin: 0;
        font-size: 16px;
      }
      .block {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .label {
        display: block;
        margin-bottom: 12px;
      }
      .bubbles {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: 88%;
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 10px;
      }
      .bubble:nth-child(odd) {
        align-self: flex-start;
        background: #fbfbf8;
        border: 1px solid var(--line);
      }
      .bubble:nth-child(even) {
        align-self: flex-end;
        background: var(--ink);
        color: #f5f5f1;
      }
      .bubble code {
        background: rgb(127 127 127 / 0.22);
      }
      .avoid {
        margin: 0;
        font-size: 14px;
        color: #3b3b38;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        padding: 3px 11px;
        font-size: 13px;
        text-decoration: none;
        background: transparent;
        border: 1px solid #a9a9a3;
        border-radius: 999px;
      }
      .chip:hover {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--panel);
      }
      details summary {
        cursor: pointer;
        list-style-position: inside;
      }
      details .label {
        display: inline;
        margin: 0;
      }
      .entry {
        margin-top: 12px;
        font-size: 14px;
      }
      .entry p,
      .entry ul,
      .entry ol,
      .entry blockquote,
      .entry pre,
      .entry .table {
        margin: 0 0 12px;
      }
      .entry ul,
      .entry ol {
        padding-left: 20px;
      }
      .entry h4 {
        margin: 16px 0 6px;
        font-size: 14px;
      }
      .entry blockquote {
        padding-left: 12px;
        border-left: 2px solid var(--line);
      }
      .entry .table {
        overflow-x: auto;
      }
      .entry table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .entry th,
      .entry td {
        padding: 6px 8px 6px 0;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      .entry pre {
        padding: 10px;
        overflow-x: auto;
        background: #e7e7e2;
        border-radius: 6px;
      }
      code {
        padding: 1px 4px;
        font: 0.9em var(--mono);
        background: #e7e7e2;
        border-radius: 4px;
      }
      pre code {
        padding: 0;
        background: none;
      }

      @media (max-width: 720px) {
        #app {
          flex-direction: column;
        }
        #panel {
          flex: 0 0 58dvh;
          width: 100%;
          height: 58dvh;
          border-top: 1px solid var(--line);
          border-left: 0;
        }
        #panel-body {
          padding: 22px 20px 36px;
        }
        #hint,
        #resizer,
        .has-selection #brand {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <div
          id="graph"
          role="img"
          aria-label="Force-directed graph of entries and the links between them. Use search to reach one by keyboard."
        ></div>
        <div id="top-left">
          <button
            id="search-btn"
            class="round"
            aria-label="Search entries"
            title="Search (/)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.8-3.8" />
            </svg>
          </button>
          <span id="brand">Dictionary of Distributed Systems</span>
        </div>
        <button
          id="info-btn"
          class="round"
          aria-label="About this graph"
          aria-expanded="false"
          title="About"
        >
          i
        </button>
        <div id="search" class="popover" hidden>
          <input
            id="search-input"
            type="search"
            placeholder="Search entries"
            aria-label="Search entries"
            role="combobox"
            aria-expanded="true"
            aria-controls="results"
            autocomplete="off"
            spellcheck="false"
          />
          <ul id="results" role="listbox" aria-label="Matching entries"></ul>
        </div>
        <div id="info" class="popover" hidden>
          <h2>Reading the graph</h2>
          <p id="info-counts"></p>
          <p>
            Larger, darker circles are linked to by more entries. Dots on a line
            move in the direction of the link.
          </p>
          <p>
            Click a circle to read it. Drag to rearrange, scroll to zoom.
            <kbd>/</kbd> searches, <kbd>Esc</kbd> closes.
          </p>
        </div>
        <p id="hint">Click a circle, or press / to search</p>
      </main>
      <div
        id="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize details panel"
        aria-controls="panel"
        tabindex="0"
        title="Drag to resize, double-click to reset"
        hidden
      ></div>
      <aside id="panel" aria-label="Term details" hidden>
        <button id="close" class="round" aria-label="Close details">×</button>
        <div id="panel-body"></div>
      </aside>
    </div>

    <script id="graph-data" type="application/json">
      {"title":"Dictionary of Distributed Systems","noun":"entry","nouns":"entries","labels":{"quotes":"Heard in the wild","note":"Note","outgoing":"Connects to","incoming":"Linked from","body":"Full entry"},"sections":["Failure","Time and Order","Consistency Models","Replication and Convergence","Consensus and Coordination","Transactions and Delivery"],"terms":[{"name":"Distributed system","section":0,"description":"A set of computers that coordinate by passing messages over a network, with no shared memory and no shared clock.","body":"\u003cp>A set of computers that work toward a shared result by passing messages over a network. Each computer, or \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a>, has its own memory and its own clock. No node can read another's state directly. It can only send a message and wait for a reply, and what it learns from that reply may already be out of date.\u003c/p>\u003cp>Three differences separate this from a program running on one machine:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concern\u003c/th>\u003cth>On one machine\u003c/th>\u003cth>In a distributed system\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Failure\u003c/td>\u003ctd>The program usually stops as a unit\u003c/td>\u003ctd>Some parts fail while others run, a \u003ca href=\"#Partial%20failure\" data-term=\"Partial failure\">partial failure\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Time\u003c/td>\u003ctd>One clock orders events\u003c/td>\u003ctd>Clocks disagree by some amount of \u003ca href=\"#Clock%20skew\" data-term=\"Clock skew\">clock skew\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication\u003c/td>\u003ctd>A function call returns or throws\u003c/td>\u003ctd>Messages can be delayed, lost, duplicated or reordered\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>These differences explain why code that passes every test on a laptop can misbehave in production. A request times out, but the write it carried was applied. Two servers each believe they are in charge, which is \u003ca href=\"#Split%20brain\" data-term=\"Split brain\">split brain\u003c/a>. A user saves a change and then sees the old value, because the read went to a copy that had not received the update.\u003c/p>\u003cp>Teams distribute a system to survive the loss of a machine, to hold more data or serve more load than one machine can, or to place data closer to users. Each of these goals adds coordination work. If one machine meets the requirements, using one machine avoids this class of problems.\u003c/p>\u003cp>The other entries in this dictionary name the parts of that coordination work: detecting failure, ordering events without a shared clock, keeping copies of data in step, reaching \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a>, and defining what a delivery guarantee promises.\u003c/p>","avoid":"","usage":["The service keeps its job queue in memory. Can we run a second instance for redundancy?","Not without changing the design. Two instances means a distributed system, so we'd have to decide who owns each job and what happens when they can't reach each other."],"out":[1,2,11,10,38]},{"name":"Node","section":0,"description":"One participant in a distributed system, with its own state, that communicates with the others by sending messages.","body":"\u003cp>One participant in a \u003ca href=\"#Distributed%20system\" data-term=\"Distributed system\">distributed system\u003c/a>. A node holds its own state and communicates with other participants by sending messages. Papers on distributed algorithms often call it a process.\u003c/p>\u003cp>What counts as a node depends on the layer being discussed:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Context\u003c/th>\u003cth>What &quot;node&quot; usually means\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Consensus\" data-term=\"Consensus\">Consensus\u003c/a> algorithm\u003c/td>\u003ctd>One process that votes and keeps a log\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Database cluster\u003c/td>\u003ctd>One server process holding some or all of the data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Container orchestrator\u003c/td>\u003ctd>One machine that runs containers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network diagram\u003c/td>\u003ctd>Any addressable device on the network\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The difference matters when counting how many failures a system can survive. Three database nodes running as containers on one physical host are three nodes to the database and one failure domain (a set of components that fail together). If the host loses power, all three stop. Replication settings that look safe on paper give no protection in that layout, so placement across hosts, racks or zones has to be checked separately from the node count.\u003c/p>\u003cp>A node's identity also matters. Peers remember what a node has promised, so a node that loses its disk and rejoins under the same identity can break a protocol's assumptions. A \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a> node that forgets its vote could vote twice in one election, which could produce two leaders. For this reason, a node that has lost its durable state should normally rejoin as a new member through the cluster's membership process.\u003c/p>\u003cp>Nodes are usually described as correct or faulty. A correct node follows the protocol. A faulty node has stopped, as in a \u003ca href=\"#Crash%20failure\" data-term=\"Crash failure\">crash failure\u003c/a>, or misbehaves, as in a \u003ca href=\"#Byzantine%20failure\" data-term=\"Byzantine failure\">Byzantine failure\u003c/a>.\u003c/p>","avoid":"","usage":["We run three nodes, so losing one is fine.","Check the placement first. If two of them share a host, losing that host takes out a \u003ca href=\"#Quorum\" data-term=\"Quorum\">quorum\u003c/a> and writes stop."],"out":[0,38,41,5,6,29]},{"name":"Partial failure","section":0,"description":"Some parts of a distributed system fail while others keep working, leaving callers unsure what actually happened.","body":"\u003cp>A condition in which some parts of a \u003ca href=\"#Distributed%20system\" data-term=\"Distributed system\">distributed system\u003c/a> fail while others keep working. A program on one machine usually fails as a unit. Across a network, one \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> can stop, slow down or lose contact while the rest continue, and the nodes still running may not know.\u003c/p>\u003cp>The practical difficulty is that a caller often cannot tell what happened. When a remote call times out, any of these may be true:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>What happened\u003c/th>\u003cth>Was the work done?\u003c/th>\u003cth>What the caller sees\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Request lost on the way\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Timeout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Receiver crashed before processing\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Timeout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Receiver crashed after processing\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Timeout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Response lost on the way back\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Timeout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Receiver is slow and still working\u003c/td>\u003ctd>Not yet, but it may be\u003c/td>\u003ctd>Timeout\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A timeout therefore means &quot;outcome unknown&quot;, not &quot;failed&quot;. Code that treats it as a failure produces a familiar bug: a payment call times out, the client retries, and the customer is charged twice because the first attempt had succeeded. Code that does not retry has the opposite problem, and the payment may never happen.\u003c/p>\u003cp>Handling partial failure means designing each remote operation for the unknown case. Set a timeout on every call, so a lost response cannot hang the caller indefinitely. Make retried operations safe through \u003ca href=\"#Idempotency\" data-term=\"Idempotency\">idempotency\u003c/a>, usually with a client-generated request ID that the receiver records. For multi-step work, decide how an interrupted sequence is finished or undone, and run a periodic reconciliation (a job that compares records and corrects mismatches) where money or other important state is involved.\u003c/p>","avoid":"","usage":["The charge endpoint returned a 504, so the order was marked failed. But the customer's bank shows the payment.","That's partial failure. The gateway timed out after the charge went through. We should record the attempt with an idempotency key and query its status before retrying."],"out":[0,1,51]},{"name":"Network partition","section":0,"description":"A network fault that splits nodes into groups that cannot reach each other while each group keeps running.","body":"\u003cp>A network fault that divides \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> into groups that cannot exchange messages across the divide, while communication within each group continues. Every node may be healthy and still serving requests. The cause can be a failed switch, a bad firewall rule, a routing change, or a lost link between data centers.\u003c/p>\u003cp>From inside one group, a partition looks the same as the other group having crashed: messages stop arriving and \u003ca href=\"#Heartbeat\" data-term=\"Heartbeat\">heartbeats\u003c/a> time out. This ambiguity produces a typical incident. Each side concludes that the other is dead, both keep accepting writes, and when the network heals the data has diverged. That outcome is \u003ca href=\"#Split%20brain\" data-term=\"Split brain\">split brain\u003c/a>.\u003c/p>\u003cp>Partitions are not always clean:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Shape\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Complete\u003c/td>\u003ctd>Groups exchange no messages in either direction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Asymmetric\u003c/td>\u003ctd>A can reach B, but B cannot reach A\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Partial\u003c/td>\u003ctd>A and B cannot talk, but both can still reach C\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Intermittent\u003c/td>\u003ctd>Links drop and recover repeatedly\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The asymmetric and partial shapes are harder to handle because nodes disagree about who is reachable. A node may stop receiving a leader's messages while its own messages still get through, and may then start elections that disrupt the cluster.\u003c/p>\u003cp>During a partition, a system holding replicated data has to make the choice described by the \u003ca href=\"#CAP%20theorem\" data-term=\"CAP theorem\">CAP theorem\u003c/a>. It can refuse some requests to preserve consistency, usually by letting only the side with a \u003ca href=\"#Quorum\" data-term=\"Quorum\">quorum\u003c/a> proceed. Or it can keep serving on both sides and reconcile afterwards with a rule such as \u003ca href=\"#Last-write-wins\" data-term=\"Last-write-wins\">last-write-wins\u003c/a> or a data structure such as a \u003ca href=\"#CRDT\" data-term=\"CRDT\">CRDT\u003c/a>. The choice should be made per use case and tested by injecting partitions, because the code paths involved rarely run in normal operation.\u003c/p>","avoid":"","usage":["Both regions look healthy on their own dashboards, but replication lag keeps climbing.","That looks like a network partition between them. Check which side has quorum before anyone fails over, or we'll end up with two leaders."],"out":[1,8,10,20,29,36,37]},{"name":"Fallacies of distributed computing","section":0,"description":"Eight false assumptions about networks, such as \"the network is reliable\", that lead to fragile distributed code.","body":"\u003cp>Eight false assumptions that developers commonly make when writing software for a \u003ca href=\"#Distributed%20system\" data-term=\"Distributed system\">distributed system\u003c/a>. The list is usually attributed to L Peter Deutsch and colleagues at Sun Microsystems in the 1990s.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fallacy\u003c/th>\u003cth>What goes wrong when code assumes it\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>The network is reliable\u003c/td>\u003ctd>Calls with no timeout or retry hang or silently lose work\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Latency is zero\u003c/td>\u003ctd>A loop making one remote call per item takes seconds instead of milliseconds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bandwidth is infinite\u003c/td>\u003ctd>Large payloads saturate a link and delay unrelated traffic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The network is secure\u003c/td>\u003ctd>Unauthenticated internal traffic is open to anyone who gets inside\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Topology doesn't change\u003c/td>\u003ctd>Hard-coded addresses break when machines move or are replaced\u003c/td>\u003c/tr>\u003ctr>\u003ctd>There is one administrator\u003c/td>\u003ctd>Another team's firewall or DNS change breaks your service\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transport cost is zero\u003c/td>\u003ctd>Serialization CPU and data transfer charges grow with traffic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The network is homogeneous\u003c/td>\u003ctd>Mixed hardware, protocol versions or packet size limits fail on some paths only\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The fallacies persist because a development machine makes them approximately true. On localhost, calls do not get lost, latency is negligible and nobody else changes the configuration. Code written there can pass its tests and then fail under production conditions, often as a \u003ca href=\"#Partial%20failure\" data-term=\"Partial failure\">partial failure\u003c/a> that is hard to reproduce locally.\u003c/p>\u003cp>Libraries for remote procedure calls (calling a function on another machine) add to the problem by making a network call look like a local one.\u003c/p>\u003cp>To counter the assumptions, treat each network call as an operation that can fail. Give it a timeout, decide whether it can be retried safely, batch work to reduce round trips, and authenticate traffic between services. Test with injected latency and packet loss, so the failure paths run before production exercises them.\u003c/p>","avoid":"","usage":["The export worked in staging, but in production it takes twenty minutes.","It makes a separate call to the pricing service per row. That's the 'latency is zero' fallacy. Staging runs both services on one box."],"out":[0,2]},{"name":"Crash failure","section":0,"description":"A failure in which a node stops executing, as opposed to continuing to run and behaving incorrectly.","body":"\u003cp>A failure in which a \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> stops executing and sends no further messages. Before it stops, the node follows its protocol correctly. This is the failure assumption behind many replication and agreement algorithms, because a stopped node cannot send false information.\u003c/p>\u003cp>Formal work separates failures into models, which define what a faulty node is allowed to do:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Model\u003c/th>\u003cth>What a faulty node may do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Crash-stop\u003c/td>\u003ctd>Halts permanently\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Crash-recovery\u003c/td>\u003ctd>Halts, then may restart with whatever it saved to disk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Omission\u003c/td>\u003ctd>Keeps running but fails to send or receive some messages\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Byzantine%20failure\" data-term=\"Byzantine failure\">Byzantine\u003c/a>\u003c/td>\u003ctd>Does anything, including sending false or conflicting messages\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Production systems mostly face crash-recovery, since machines reboot and processes restart. \u003ca href=\"#Paxos\" data-term=\"Paxos\">Paxos\u003c/a> and \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a> are designed for this model. Their safety depends on a restarted node remembering what it wrote to stable storage, such as the votes it cast and the log entries it acknowledged.\u003c/p>\u003cp>That dependency explains a common data-loss bug. A node acknowledges a write while the data is still in the operating system's buffer, the machine loses power, and the write is gone after the restart even though the client was told it succeeded. Durable systems call fsync (an operation that forces buffered data to disk) before acknowledging, and accept the added latency.\u003c/p>\u003cp>Other nodes cannot observe a crash directly. They see only silence, which could also come from a slow node or a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a>. A \u003ca href=\"#Failure%20detector\" data-term=\"Failure detector\">failure detector\u003c/a> can suspect a crash but, in an asynchronous network, cannot confirm one. A node that was declared dead may still be running, so recovery logic has to allow for it to return.\u003c/p>","avoid":"","usage":["The replica acknowledged the write, then the host rebooted and the row was gone.","So it acked before syncing to disk. In a crash-recovery model that promise means nothing unless it survives the restart."],"out":[1,6,40,41,3,9]},{"name":"Byzantine failure","section":0,"description":"A failure in which a node behaves arbitrarily, including sending false or conflicting messages to different peers.","body":"\u003cp>A failure in which a \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> deviates from its protocol in any way, including sending false data or telling different peers different things. The name comes from the Byzantine Generals Problem, published by Lamport, Shostak and Pease in 1982, in which loyal generals must agree on a plan even though some of their number are traitors.\u003c/p>\u003cp>A Byzantine node need not be malicious. Faulty memory, a firmware bug, corrupted data or two software versions that interpret a message differently can all make a node produce wrong output while appearing to work. An attacker who controls a node is the other main case.\u003c/p>\u003cp>This model is harder to tolerate than a \u003ca href=\"#Crash%20failure\" data-term=\"Crash failure\">crash failure\u003c/a>, because other nodes cannot take a message at face value:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Failure model\u003c/th>\u003cth>Nodes needed to tolerate f faults with \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a> in a partially synchronous network\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Crash\u003c/td>\u003ctd>2f + 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Byzantine\u003c/td>\u003ctd>3f + 1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Partially synchronous means the network may misbehave for a while but eventually delivers messages within some bound. Under those conditions, tolerating one Byzantine node takes four nodes, compared with three for one crash.\u003c/p>\u003cp>\u003ca href=\"#Paxos\" data-term=\"Paxos\">Paxos\u003c/a> and \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a> do not tolerate Byzantine failures. A single Raft leader that lies can corrupt the replicated log. Byzantine fault-tolerant protocols, such as PBFT (Practical Byzantine Fault Tolerance), add extra message rounds and cryptographic verification. They are mainly used where participants do not trust each other, as in blockchains.\u003c/p>\u003cp>Systems run by one organization usually assume crash failures and handle the likeliest forms of corruption separately. Checksums on disk blocks and network messages turn silent corruption into a detectable error, which the system can then treat as a crash and repair from another copy.\u003c/p>","avoid":"","usage":["One replica keeps returning a different hash for the same block. Could Raft have caught that?","No, Raft assumes nodes don't lie. That's a Byzantine failure, probably bad memory or disk. Add checksums so corruption shows up as an error."],"out":[1,5,38,40,41]},{"name":"Gray failure","section":0,"description":"A degraded state where a component looks healthy to some observers while it is failing for others.","body":"\u003cp>A degraded state in which a component appears healthy to some observers while it is failing for others. Researchers describe this as differential observability: the monitoring system and the application see different realities. It differs from a clean \u003ca href=\"#Crash%20failure\" data-term=\"Crash failure\">crash failure\u003c/a>, where the component stops and every observer eventually notices.\u003c/p>\u003cp>The typical symptom is a dashboard that stays green during a user-visible outage. A server answers its health check on a lightweight endpoint, so the load balancer keeps sending it traffic, while real requests fail because they depend on a disk, downstream connection or thread pool that the check does not exercise.\u003c/p>\u003cp>Common forms include:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Degradation\u003c/th>\u003cth>Why checks may miss it\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Disk\u003c/td>\u003ctd>Some reads take seconds\u003c/td>\u003ctd>The check does not touch the slow path\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network card\u003c/td>\u003ctd>Drops a small share of packets\u003c/td>\u003ctd>Small probes usually get through or retry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Process\u003c/td>\u003ctd>Worker threads stuck, listener alive\u003c/td>\u003ctd>The health endpoint runs on a separate thread\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dependency\u003c/td>\u003ctd>One shard (a slice of the data) is unavailable\u003c/td>\u003ctd>The check queries a different shard\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Gray failures can also prevent automatic recovery. A \u003ca href=\"#Failure%20detector\" data-term=\"Failure detector\">failure detector\u003c/a> that relies on \u003ca href=\"#Heartbeat\" data-term=\"Heartbeat\">heartbeats\u003c/a> keeps reporting the \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> as alive, so no failover happens. A slow node can be worse than a dead one, because requests queue behind it and hold resources in its callers, which can spread the slowdown to other services.\u003c/p>\u003cp>Detection works better from the perspective of the callers. Track error rate and latency percentiles per instance, compare each instance to its peers, and remove outliers from rotation. Make health checks exercise the same dependencies as real requests, with care that a shared dependency failing does not mark every instance unhealthy at once.\u003c/p>","avoid":"","usage":["All instances pass health checks, but about one percent of checkouts hang.","Break latency down by host. If one stands out, it's a gray failure, probably its disk. Drain it even though the health check says it's fine."],"out":[5,9,8,1]},{"name":"Heartbeat","section":0,"description":"A small message a node sends at regular intervals so that other nodes can tell it is still reachable.","body":"\u003cp>A small message that a \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> sends at regular intervals so that other nodes can tell it is still reachable. If the expected heartbeats stop arriving for longer than a timeout, the receiver begins to suspect the sender has failed. In \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a>, for example, a leader sends periodic messages to its followers, and a follower that hears nothing for its election timeout starts a new election.\u003c/p>\u003cp>A missing heartbeat does not prove a crash. The sender may also be paused, overloaded, or cut off by a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a>. A heartbeat system therefore produces suspicion, which a \u003ca href=\"#Failure%20detector\" data-term=\"Failure detector\">failure detector\u003c/a> turns into a decision.\u003c/p>\u003cp>Two settings control the behavior, and each one trades detection speed against false alarms:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Setting\u003c/th>\u003cth>Lower value\u003c/th>\u003cth>Higher value\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Interval\u003c/td>\u003ctd>Faster detection, more network and CPU use\u003c/td>\u003ctd>Less overhead, slower detection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Timeout\u003c/td>\u003ctd>Faster failover, more false positives\u003c/td>\u003ctd>Fewer false positives, longer outages\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A timeout set too low produces a recognizable pattern: leaders change repeatedly during load spikes although no machine has failed. A long garbage collection pause (the runtime halting a program to reclaim memory) or a saturated disk delays a heartbeat past the timeout, the cluster fails over, and the failover adds more load. The timeout should sit well above the normal variation in heartbeat delay, and the interval is usually a fraction of the timeout so that one lost message does not trigger suspicion.\u003c/p>\u003cp>A heartbeat shows only that the code sending it is running. If it runs on a dedicated thread, it can continue while the threads doing real work are stuck, which is one source of \u003ca href=\"#Gray%20failure\" data-term=\"Gray failure\">gray failure\u003c/a>. Tying the heartbeat to real progress, such as a worker completing its loop, narrows that gap.\u003c/p>","avoid":"","usage":["We had three \u003ca href=\"#Leader%20election\" data-term=\"Leader election\">leader elections\u003c/a> during the batch job, but no node went down.","The heartbeats are probably missing the timeout during GC pauses. Check the pause times before we raise it."],"out":[1,41,3,9,7,42]},{"name":"Failure detector","section":0,"description":"A component that reports which nodes it suspects have failed. Over an unreliable network, its answers can be wrong.","body":"\u003cp>A component that reports which \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> it suspects have failed, usually based on missing \u003ca href=\"#Heartbeat\" data-term=\"Heartbeat\">heartbeats\u003c/a> or timed-out requests. In an asynchronous network, where messages have no upper bound on delay, a slow node and a dead node look identical, so no detector can be right every time.\u003c/p>\u003cp>Chandra and Toueg formalized failure detectors in the 1990s using two kinds of property:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Property\u003c/th>\u003cth>Question it answers\u003c/th>\u003cth>Violation looks like\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Completeness\u003c/td>\u003ctd>Is every crashed node eventually suspected?\u003c/td>\u003ctd>A dead node stays in rotation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Accuracy\u003c/td>\u003ctd>Are working nodes left unsuspected?\u003c/td>\u003ctd>A healthy node is removed or replaced\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Real detectors have to trade one against the other. A short timeout finds crashes quickly but raises false positives, and a long timeout does the reverse. A false positive is costly because it can trigger a failover, data rebalancing, or a leader change on a cluster that was working. A pause on one node can then turn into cluster-wide churn.\u003c/p>\u003cp>Some detectors output a level of suspicion in place of a yes-or-no answer. The phi accrual detector, used by Cassandra and Akka, compares the time since the last heartbeat with the recent distribution of arrival times. Each application then picks its own threshold for acting.\u003c/p>\u003cp>Failure detectors also matter in theory. \u003ca href=\"#FLP%20impossibility\" data-term=\"FLP impossibility\">FLP impossibility\u003c/a> rules out deterministic \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a> in a purely asynchronous system with even one crash. Chandra and Toueg showed that consensus becomes solvable with a majority of correct nodes and a detector that may make mistakes, provided it eventually suspects every crashed node and eventually stops suspecting at least one correct node.\u003c/p>\u003cp>Treat a detector's output as a hint. Actions that are unsafe if the node is still alive need protection such as a \u003ca href=\"#Fencing%20token\" data-term=\"Fencing token\">fencing token\u003c/a>.\u003c/p>","avoid":"","usage":["The detector marked node four dead, but it's serving traffic.","It's a suspicion, not a fact. Node four probably stalled for a few seconds. Make sure the failover fences it off."],"out":[1,8,39,38,45]},{"name":"Split brain","section":0,"description":"Two parts of a cluster each act as the authority at the same time, accepting writes that conflict.","body":"\u003cp>A state in which two parts of a cluster each act as the authority at the same time. Usually this means two \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> both believe they are the leader and both accept writes. The histories then diverge, and when the cluster reunites there may be no correct way to combine them.\u003c/p>\u003cp>The usual trigger is a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a>: each side stops hearing from the other, assumes it has died, and promotes or keeps its own leader. A pause can do the same without any network fault. A leader stalls during a long garbage collection (the runtime halting the program to reclaim memory), the others elect a replacement, and the old leader wakes up still believing it is in charge.\u003c/p>\u003cp>The damage appears as conflicting records. Two customers hold the same reserved seat, or an account balance reflects only half of its transactions. Repair often means choosing one history and manually salvaging the other.\u003c/p>\u003cp>Systems layer several defences:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Defence\u003c/th>\u003cth>How it helps\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Majority \u003ca href=\"#Quorum\" data-term=\"Quorum\">quorum\u003c/a>\u003c/td>\u003ctd>At most one side of a partition can hold a majority\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Term or epoch numbers\u003c/td>\u003ctd>A newer leader's number outranks the old one, so peers reject it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Fencing%20token\" data-term=\"Fencing token\">Fencing token\u003c/a>\u003c/td>\u003ctd>Storage rejects writes from a superseded leader\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Node fencing\u003c/td>\u003ctd>The cluster cuts power or storage access to the old leader\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A quorum does not stop an old leader from believing it still leads. In \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a>, a deposed leader cut off from the majority can hold that belief for a while, but it cannot commit new entries. It could still serve stale reads unless it confirms its leadership first. Two-node clusters cannot form a majority after losing contact, so they need a third voter, often called a witness or tiebreaker.\u003c/p>","avoid":"","usage":["After the switch came back, both database nodes were claiming to be primary.","That's split brain. Stop writes on one before they diverge further, and add a witness so a two-node pair can't do this again."],"out":[1,3,29,45,41]},{"name":"Clock skew","section":1,"description":"The difference between two clocks' readings at the same instant, which can make events appear out of order.","body":"\u003cp>The difference between the readings of two clocks at the same instant. If one \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> reads 12:00:00.000 while another reads 12:00:00.250, the skew between them is 250 milliseconds. Every machine keeps its own clock, so some skew is always present. \u003ca href=\"#Clock%20drift\" data-term=\"Clock drift\">Clock drift\u003c/a> is the main cause: clocks run at slightly different rates, and the gap grows until something corrects it.\u003c/p>\u003cp>Skew causes bugs wherever code compares timestamps taken on different machines:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Where\u003c/th>\u003cth>What skew does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Logs and traces\u003c/td>\u003ctd>An effect appears to happen before its cause\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Auth tokens\u003c/td>\u003ctd>A token looks issued in the future, or expires early\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Caches\u003c/td>\u003ctd>Entries with an expiry time live too long or too short\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Conflict resolution\u003c/td>\u003ctd>With \u003ca href=\"#Last-write-wins\" data-term=\"Last-write-wins\">last-write-wins\u003c/a>, an older write can beat a newer one\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The conflict resolution case loses data with no error. A user updates a record through a node whose clock is behind, and the update carries an earlier timestamp than the value it replaces. The store keeps the old value and reports success.\u003c/p>\u003cp>\u003ca href=\"#NTP\" data-term=\"NTP\">NTP\u003c/a> reduces skew but does not remove it, and its accuracy depends on network conditions. Code should therefore tolerate a margin: auth libraries commonly allow some leeway, for example. Monitor the offset of each host, because a broken time daemon produces no errors of its own.\u003c/p>\u003cp>Timestamps from different machines cannot establish which event came first when the gap between events is within the skew. To order events reliably, use the \u003ca href=\"#Happens-before\" data-term=\"Happens-before\">happens-before\u003c/a> relation through a \u003ca href=\"#Logical%20clock\" data-term=\"Logical clock\">logical clock\u003c/a>, or a single authority that assigns sequence numbers.\u003c/p>\u003cp>Some network measurement documents use &quot;skew&quot; for a difference in clock rate. In writing about \u003ca href=\"#Distributed%20system\" data-term=\"Distributed system\">distributed systems\u003c/a>, it normally means the difference in readings.\u003c/p>","avoid":"","usage":["The trace says the database responded before the API sent the query.","Those spans come from different hosts. It's clock skew, so don't read anything into the order at that scale."],"out":[1,12,36,13,14,15,0]},{"name":"Clock drift","section":1,"description":"The rate at which a clock runs fast or slow compared with a reference, causing its error to grow over time.","body":"\u003cp>The rate at which a clock runs fast or slow compared with a reference clock. Computer clocks count oscillations of a quartz crystal, and no two crystals run at exactly the same frequency. Temperature, age and manufacturing variation all shift the rate.\u003c/p>\u003cp>Drift is usually measured in parts per million (ppm). A clock that is off by 50 ppm gains or loses 4.32 seconds per day.\u003c/p>\u003cp>Drift and \u003ca href=\"#Clock%20skew\" data-term=\"Clock skew\">clock skew\u003c/a> are related but distinct:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Measures\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Drift\u003c/td>\u003ctd>Rate of error of one clock\u003c/td>\u003ctd>20 ppm fast\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Skew\u003c/td>\u003ctd>Gap between two clocks at one moment\u003c/td>\u003ctd>40 ms apart\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Left alone, drift turns into growing skew. \u003ca href=\"#NTP\" data-term=\"NTP\">NTP\u003c/a> counters this by measuring the clock against a time server and correcting it, and it also estimates the local frequency error so it can compensate between checks. The failure to watch for is a machine whose time synchronization has silently stopped. Nothing breaks at first. Days later, its timestamps are seconds away from its peers, and token validation or log ordering starts to go wrong on that host only.\u003c/p>\u003cp>Drift also affects timers, which matters for anything based on a duration. A \u003ca href=\"#Lease\" data-term=\"Lease\">lease\u003c/a> holder and its grantor each measure the lease period on their own clocks. If the holder's clock runs slow, it can believe the lease is still valid after the grantor considers it expired. Lease protocols handle this by assuming a maximum drift rate and building in a safety margin.\u003c/p>\u003cp>For measuring elapsed time, use a monotonic clock (a timer that only moves forward). It does not jump when the wall clock is corrected, but it still drifts, so it does not remove the need for that margin.\u003c/p>","avoid":"","usage":["This one VM keeps rejecting valid auth tokens, and only that VM.","Check its time sync daemon. If sync stopped weeks ago, clock drift has had plenty of time to push it outside the leeway window."],"out":[11,13,43]},{"name":"NTP","section":1,"description":"Network Time Protocol. Synchronizes a machine's clock with time servers by estimating offset and network delay.","body":"\u003cp>Network Time Protocol, the standard way for machines to synchronize their clocks over a network. A client exchanges timestamped packets with one or more time servers, estimates how far its clock is off, and corrects it. It runs over UDP on port 123, and common implementations include ntpd and chrony.\u003c/p>\u003cp>Servers are arranged in levels called strata. Stratum 0 is a reference source such as an atomic clock or GPS receiver. A stratum 1 server is attached directly to one, a stratum 2 server synchronizes from stratum 1, and so on.\u003c/p>\u003cp>Each measurement uses four timestamps:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Timestamp\u003c/th>\u003cth>Taken by\u003c/th>\u003cth>Moment\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>t1\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Request sent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>t2\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Request received\u003c/td>\u003c/tr>\u003ctr>\u003ctd>t3\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Response sent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>t4\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Response received\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>From these, the client computes \u003ccode>offset = ((t2 - t1) + (t3 - t4)) / 2\u003c/code> and \u003ccode>delay = (t4 - t1) - (t3 - t2)\u003c/code>. The offset formula assumes the request and response took equal time. When the paths are asymmetric, the result is wrong by half the difference between the two one-way delays, and the client cannot detect this from the timestamps alone. NTP therefore narrows \u003ca href=\"#Clock%20skew\" data-term=\"Clock skew\">clock skew\u003c/a> but cannot eliminate it.\u003c/p>\u003cp>The client applies a correction in one of two ways. Slewing runs the clock slightly fast or slow until the error closes. Stepping sets the clock to the new value at once, and is normally reserved for large errors.\u003c/p>\u003cp>A step can move the wall clock backward, which produces confusing bugs: a measured duration comes out negative, or a timeout fires early or late. Code that measures elapsed time should use a monotonic clock (a timer that only moves forward). NTP also keeps correcting \u003ca href=\"#Clock%20drift\" data-term=\"Clock drift\">clock drift\u003c/a> between measurements, so a stopped daemon lets error build up with no visible failure.\u003c/p>","avoid":"","usage":["Our request duration metric recorded negative values for a few seconds last night.","NTP probably stepped the clock backward. That code should use a monotonic clock, not wall-clock time."],"out":[11,12]},{"name":"Happens-before","section":1,"description":"Lamport's partial order on events. Event A happens before B if information from A could have reached B.","body":"\u003cp>A relation on events, defined by Leslie Lamport in 1978, that captures when one event could have influenced another. It orders events by the flow of information and makes no reference to clock time, which makes it usable in a \u003ca href=\"#Distributed%20system\" data-term=\"Distributed system\">distributed system\u003c/a> where clocks disagree.\u003c/p>\u003cp>Event A happens before event B, written A → B, if any of these rules applies:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>Condition\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Local order\u003c/td>\u003ctd>A and B are on the same \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a>, and A came first\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Message\u003c/td>\u003ctd>A is the sending of a message, and B is its receipt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transitivity\u003c/td>\u003ctd>A → C and C → B for some event C\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>If neither A → B nor B → A holds, the two events are concurrent. Concurrent does not mean simultaneous. It means no chain of messages connects them, so neither could have affected the other, even if one occurred an hour earlier by the wall clock.\u003c/p>\u003cp>This makes happens-before a partial order: some pairs of events have a defined order and others do not.\u003c/p>\u003cp>The relation explains a common display bug. In a chat app, a reply appears before the question it answers, because the two messages reached a replica in the wrong order or were sorted by timestamps from machines with \u003ca href=\"#Clock%20skew\" data-term=\"Clock skew\">clock skew\u003c/a>. The reply causally depends on the question, so any correct ordering must place the question first. \u003ca href=\"#Causal%20consistency\" data-term=\"Causal consistency\">Causal consistency\u003c/a> is the guarantee that preserves this order.\u003c/p>\u003cp>Note that A → B means A could have influenced B, not that it did. The relation tracks potential causality. A \u003ca href=\"#Logical%20clock\" data-term=\"Logical clock\">logical clock\u003c/a> makes it computable: a \u003ca href=\"#Lamport%20timestamp\" data-term=\"Lamport timestamp\">Lamport timestamp\u003c/a> respects the order, and a \u003ca href=\"#Vector%20clock\" data-term=\"Vector clock\">vector clock\u003c/a> can also tell whether two events are concurrent.\u003c/p>","avoid":"","usage":["These two writes are a millisecond apart. Which one came first?","Neither, as far as we can tell. No message links them, so there's no happens-before relation. They're concurrent and we need a conflict rule."],"out":[0,1,11,24,15,16,17]},{"name":"Logical clock","section":1,"description":"A counter-based mechanism for ordering events by causality instead of by physical time.","body":"\u003cp>A mechanism that assigns numbers to events so they can be ordered by causality instead of physical time. It counts events and messages and does not measure seconds. A \u003ca href=\"#Distributed%20system\" data-term=\"Distributed system\">distributed system\u003c/a> uses one because physical clocks on different \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> disagree through \u003ca href=\"#Clock%20skew\" data-term=\"Clock skew\">clock skew\u003c/a>, so their readings cannot reliably show which of two nearby events came first.\u003c/p>\u003cp>The order a logical clock tracks is the \u003ca href=\"#Happens-before\" data-term=\"Happens-before\">happens-before\u003c/a> relation. If event A could have influenced event B, the clock gives A a value that sorts before B's. Nodes achieve this by attaching their clock value to each message and updating their own clock when a message arrives, so knowledge of order travels with the data.\u003c/p>\u003cp>The main variants differ in what they can tell you and what they cost:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Variant\u003c/th>\u003cth>Stores\u003c/th>\u003cth>Detects concurrency?\u003c/th>\u003cth>Close to wall-clock time?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Lamport%20timestamp\" data-term=\"Lamport timestamp\">Lamport timestamp\u003c/a>\u003c/td>\u003ctd>One counter\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Vector%20clock\" data-term=\"Vector clock\">Vector clock\u003c/a>\u003c/td>\u003ctd>One counter per node\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Hybrid%20logical%20clock\" data-term=\"Hybrid logical clock\">Hybrid logical clock\u003c/a>\u003c/td>\u003ctd>Physical time plus a counter\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Choose by the question you need answered. If every node must rank events the same way, for example to break ties between updates, a Lamport timestamp with a node ID tie-breaker is enough. If you need to know that two updates conflicted, because neither saw the other, you need a vector clock. If you want timestamps that respect causality and can also be queried by approximate real time, as with snapshot reads in a database, a hybrid logical clock fits.\u003c/p>\u003cp>A logical clock cannot see causal links that exist outside the system. If one user makes a change and phones a colleague, who then makes a second change, the system sees no message linking the two and may treat them as concurrent.\u003c/p>","avoid":"","usage":["Can we sort these events by created_at across services?","Not safely, the hosts' clocks differ. Have each service carry a logical clock in its messages and sort on that."],"out":[0,1,11,14,16,17,18]},{"name":"Lamport timestamp","section":1,"description":"A single counter per node that guarantees if A happened before B, then A's timestamp is smaller than B's.","body":"\u003cp>A \u003ca href=\"#Logical%20clock\" data-term=\"Logical clock\">logical clock\u003c/a> made of a single integer counter on each \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a>, introduced by Leslie Lamport in 1978. It guarantees that if event A \u003ca href=\"#Happens-before\" data-term=\"Happens-before\">happens before\u003c/a> event B, then A's timestamp is smaller than B's.\u003c/p>\u003cp>The algorithm has three rules:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Event\u003c/th>\u003cth>What the node does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Local event\u003c/td>\u003ctd>Adds 1 to its counter\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Send message\u003c/td>\u003ctd>Adds 1 to its counter and attaches the value\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Receive message\u003c/td>\u003ctd>Sets its counter to max(local, received) + 1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>For example, node A at counter 5 sends a message, which increments its counter to 6 and carries the value 6. Node B, at counter 2, receives it and moves to max(2, 6) + 1 = 7. B's receive event now sorts after A's send, even though B's counter was far behind.\u003c/p>\u003cp>The guarantee runs in one direction only. If A happens before B, then L(A) &lt; L(B). The reverse does not hold: L(A) &lt; L(B) does not show that A happened before B, because the two events may be concurrent. Misreading this is the usual mistake. Code that treats the higher timestamp as &quot;the later write that saw the earlier one&quot; will silently discard a concurrent update. To detect concurrency you need a \u003ca href=\"#Vector%20clock\" data-term=\"Vector clock\">vector clock\u003c/a>.\u003c/p>\u003cp>Two events on different nodes can have the same counter value. Breaking ties by node ID, comparing (counter, node ID) pairs, gives a total order in which every pair of events is ranked and every node agrees on the ranking. That total order is consistent with causality, though its ordering of concurrent events is arbitrary. Lamport used this to implement mutual exclusion in his original paper, and \u003ca href=\"#Paxos\" data-term=\"Paxos\">Paxos\u003c/a> implementations commonly build proposal numbers from the same counter-plus-ID pair.\u003c/p>","avoid":"","usage":["This write has Lamport timestamp 42 and that one has 40, so the first one saw the second, right?","Not necessarily. A higher Lamport timestamp doesn't prove causality. They could be concurrent, and we'd need vector clocks to tell."],"out":[15,1,14,17,40]},{"name":"Vector clock","section":1,"description":"A list of counters, one per node, that shows whether two events are causally ordered or concurrent.","body":"\u003cp>A \u003ca href=\"#Logical%20clock\" data-term=\"Logical clock\">logical clock\u003c/a> made of a list of counters, one per \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a>. Each node's vector records how many events it knows about from every node, including itself. Colin Fidge and Friedemann Mattern independently published the technique in 1988.\u003c/p>\u003cp>The update rules are:\u003c/p>\u003col>\u003cli>Before each local event or send, a node increments its own entry.\u003c/li>\u003cli>Each message carries the sender's full vector.\u003c/li>\u003cli>On receipt, a node takes the element-wise maximum of its vector and the message's vector, then increments its own entry.\u003c/li>\u003c/ol>\u003cp>Two vectors are compared element by element. V(A) is less than V(B) if every entry of A is less than or equal to the matching entry of B, and at least one is strictly less.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>A\u003c/th>\u003cth>B\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>[2, 1, 0]\u003c/td>\u003ctd>[2, 2, 0]\u003c/td>\u003ctd>A happened before B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>[3, 2, 1]\u003c/td>\u003ctd>[2, 2, 0]\u003c/td>\u003ctd>B happened before A\u003c/td>\u003c/tr>\u003ctr>\u003ctd>[3, 0, 0]\u003c/td>\u003ctd>[2, 1, 0]\u003c/td>\u003ctd>Concurrent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>[2, 1, 0]\u003c/td>\u003ctd>[2, 1, 0]\u003c/td>\u003ctd>Same event\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Vector clocks characterize \u003ca href=\"#Happens-before\" data-term=\"Happens-before\">happens-before\u003c/a> exactly: A happened before B if and only if V(A) &lt; V(B). A \u003ca href=\"#Lamport%20timestamp\" data-term=\"Lamport timestamp\">Lamport timestamp\u003c/a> offers only the forward direction. This is what lets a store detect a true conflict. If two clients both edit a shopping cart based on the same version, their vectors come out concurrent, so the store can keep both versions for the application to merge, where a timestamp rule would drop one. A close relative, the version vector, tracks versions of one data item across its copies.\u003c/p>\u003cp>The cost is size. Each timestamp grows with the number of participants. Pruning old entries saves space but can misclassify concurrent updates as ordered, or the reverse.\u003c/p>","avoid":"","usage":["Why did the cart come back with two versions of the same item list?","The vector clocks were concurrent, so neither write had seen the other. The store kept both, and our merge code has to reconcile them."],"out":[15,1,14,16]},{"name":"Hybrid logical clock","section":1,"description":"A timestamp combining physical time with a counter, so it respects causality while staying close to wall-clock time.","body":"\u003cp>A timestamp that combines a physical clock reading with a \u003ca href=\"#Logical%20clock\" data-term=\"Logical clock\">logical clock\u003c/a> counter. It preserves the \u003ca href=\"#Happens-before\" data-term=\"Happens-before\">happens-before\u003c/a> order and stays close to real time. Kulkarni and colleagues described the design in 2014, and databases such as CockroachDB use a variant of it.\u003c/p>\u003cp>Each timestamp has two parts: \u003ccode>l\u003c/code>, the largest physical time this \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> has seen, and \u003ccode>c\u003c/code>, a counter that orders events sharing the same \u003ccode>l\u003c/code>. Timestamps compare by \u003ccode>l\u003c/code> first, then \u003ccode>c\u003c/code>. On a local event or send, \u003ccode>l\u003c/code> advances to the physical clock if that is larger, and \u003ccode>c\u003c/code> resets to 0. Otherwise \u003ccode>c\u003c/code> increments. On a receive, \u003ccode>l\u003c/code> becomes the largest of the local \u003ccode>l\u003c/code>, the message's \u003ccode>l\u003c/code> and the physical clock, and \u003ccode>c\u003c/code> is set so the new timestamp sorts after both inputs, or to 0 if the physical clock alone is largest.\u003c/p>\u003cp>Plain physical timestamps can violate causality under \u003ca href=\"#Clock%20skew\" data-term=\"Clock skew\">clock skew\u003c/a>, and a \u003ca href=\"#Lamport%20timestamp\" data-term=\"Lamport timestamp\">Lamport timestamp\u003c/a> has no relation to real time, so it cannot answer &quot;what was the state at 14:00?&quot;. A hybrid logical clock gives a single sortable value that does both.\u003c/p>\u003cp>Its guarantee has the same one-way shape as Lamport's. If A happened before B, then A's timestamp is smaller. A smaller timestamp does not prove causality, so it cannot detect concurrency the way a \u003ca href=\"#Vector%20clock\" data-term=\"Vector clock\">vector clock\u003c/a> can.\u003c/p>\u003cp>It still depends on reasonable clock synchronization. One node with a clock far ahead pushes \u003ccode>l\u003c/code> forward on every node it talks to, and those nodes carry that future time until physical time catches up. Systems therefore enforce a maximum tolerated offset. CockroachDB, for example, shuts down a node whose clock strays too far from its peers.\u003c/p>","avoid":"","usage":["Why did this node crash with a clock offset error?","Its clock drifted past the configured maximum. Our hybrid logical clock relies on that bound, so the node stops itself before it can break ordering."],"out":[15,14,1,11,16,17]},{"name":"TrueTime","section":1,"description":"Google Spanner's clock API, which returns a time interval guaranteed to contain the true time.","body":"\u003cp>Google's clock API, built for its Spanner database and described in a 2012 paper. Where an ordinary clock returns one value that may be wrong by an unknown amount, TrueTime returns an interval and promises that the true current time lies inside it. This makes \u003ca href=\"#Clock%20skew\" data-term=\"Clock skew\">clock skew\u003c/a> explicit.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Call\u003c/th>\u003cth>Returns\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>TT.now()\u003c/code>\u003c/td>\u003ctd>An interval \u003ccode>[earliest, latest]\u003c/code> containing true time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>TT.after(t)\u003c/code>\u003c/td>\u003ctd>True if time \u003ccode>t\u003c/code> has definitely passed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>TT.before(t)\u003c/code>\u003c/td>\u003ctd>True if time \u003ccode>t\u003c/code> has definitely not arrived\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>To keep the interval narrow, Google runs time masters in each data center with GPS receivers and atomic clocks. Machines poll the masters, and between polls the uncertainty widens according to an assumed worst-case \u003ca href=\"#Clock%20drift\" data-term=\"Clock drift\">clock drift\u003c/a> rate.\u003c/p>\u003cp>Spanner uses the interval to order transactions through a procedure called commit wait:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>The transaction acquires its locks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>The leader picks commit timestamp \u003ccode>s\u003c/code>, at least \u003ccode>TT.now().latest\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>The leader replicates the commit through \u003ca href=\"#Paxos\" data-term=\"Paxos\">Paxos\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>The leader waits until \u003ccode>TT.after(s)\u003c/code> is true, overlapping step 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>With both done, the leader releases locks and exposes the result\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The wait ensures that \u003ccode>s\u003c/code> is in the past before anyone can observe the transaction. If transaction T1 commits before T2 starts, T1 therefore has the smaller timestamp. Google calls this external consistency, and it is equivalent to strict serializability: transactions appear to run one at a time in real-time order, extending \u003ca href=\"#Linearizability\" data-term=\"Linearizability\">linearizability\u003c/a> to multiple objects.\u003c/p>\u003cp>The cost is that each read-write transaction waits out the uncertainty, so write latency depends on how narrow the interval is. The guarantee also relies on the bound being correct. Without comparable time infrastructure, systems often use a \u003ca href=\"#Hybrid%20logical%20clock\" data-term=\"Hybrid logical clock\">hybrid logical clock\u003c/a> and accept weaker guarantees.\u003c/p>","avoid":"","usage":["Why can't we copy Spanner's commit protocol onto our own Postgres cluster?","Commit wait is only safe with a trustworthy uncertainty bound. Without something like TrueTime, plain \u003ca href=\"#NTP\" data-term=\"NTP\">NTP\u003c/a> can't give us that."],"out":[11,12,40,22,18,13]},{"name":"CAP theorem","section":2,"description":"During a network partition, a replicated store cannot be both linearizable and available on every non-failing node.","body":"\u003cp>A result stating that a replicated data store cannot guarantee both \u003ca href=\"#Linearizability\" data-term=\"Linearizability\">linearizability\u003c/a> and full availability while a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a> is in progress. Eric Brewer proposed it as a conjecture in 2000, and Seth Gilbert and Nancy Lynch proved a formal version in 2002 for an asynchronous network.\u003c/p>\u003cp>The letters have narrower meanings in the proof than in everyday use:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Letter\u003c/th>\u003cth>Meaning in the proof\u003c/th>\u003cth>Common misreading\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>C\u003c/td>\u003ctd>Consistency: reads and writes on a register are linearizable\u003c/td>\u003ctd>Transaction validity rules (the C in ACID)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>Availability: every request to a non-failing \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> gets a response\u003c/td>\u003ctd>An uptime percentage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P\u003c/td>\u003ctd>Partition tolerance: the guarantees hold even if the network loses arbitrarily many messages\u003c/td>\u003ctd>A feature you can opt out of\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Suppose a partition separates two replicas (nodes holding copies of the data). A client writes a new value to one. Another client then reads from the other. To be available, the second replica must answer, but no message can tell it about the write, so it returns the old value and linearizability is broken. If it refuses to answer, availability is broken.\u003c/p>\u003cp>The popular summary, &quot;pick two of three&quot;, is misleading. A system running over a real network cannot opt out of partitions, so the choice applies only while one is happening. With a healthy network, a system can provide both C and A.\u003c/p>\u003cp>A majority-\u003ca href=\"#Quorum\" data-term=\"Quorum\">quorum\u003c/a> database is called CP, yet clients on the majority side keep working during a partition. It fails the formal A only because minority-side nodes refuse requests. A database with asynchronous replication and automatic failover meets neither definition, since it can lose acknowledged writes and rejects requests during failover. Ask what a system does in each failure case. \u003ca href=\"#PACELC\" data-term=\"PACELC\">PACELC\u003c/a> extends the framing to normal operation.\u003c/p>","avoid":"","usage":["The vendor says their database beats CAP.","Ask what a minority-side node does during a partition. It either refuses the request or risks returning stale data."],"out":[22,3,1,29,21]},{"name":"PACELC","section":2,"description":"Extends CAP. If partitioned, choose availability or consistency. Else, choose latency or consistency.","body":"\u003cp>An extension of the \u003ca href=\"#CAP%20theorem\" data-term=\"CAP theorem\">CAP theorem\u003c/a>, proposed by Daniel Abadi, that also covers how a replicated system behaves when the network is healthy. The name spells out the rule: if there is a Partition, choose Availability or Consistency; Else, choose Latency or Consistency.\u003c/p>\u003cp>CAP says nothing about normal operation, yet that is where a system spends most of its time and where its replication design has a constant cost. To confirm a write on several replicas (\u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> holding copies of the data) before responding, a system has to wait for network round trips. To respond faster, it must acknowledge before all replicas have the update, or read from a replica that may be behind.\u003c/p>\u003cp>Systems are classified with a two-part label:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Label\u003c/th>\u003cth>During a partition\u003c/th>\u003cth>Normal operation\u003c/th>\u003cth>Typical design\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>PA/EL\u003c/td>\u003ctd>Stays available\u003c/td>\u003ctd>Favors low latency\u003c/td>\u003ctd>Leaderless store with low read and write \u003ca href=\"#Quorum\" data-term=\"Quorum\">quorum\u003c/a> settings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PC/EC\u003c/td>\u003ctd>Refuses some requests\u003c/td>\u003ctd>Favors consistency\u003c/td>\u003ctd>Every operation goes through \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PC/EL\u003c/td>\u003ctd>Refuses some requests\u003c/td>\u003ctd>Favors low latency\u003c/td>\u003ctd>Single leader for writes, with stale reads from followers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PA/EC\u003c/td>\u003ctd>Stays available\u003c/td>\u003ctd>Favors consistency\u003c/td>\u003ctd>Consistent reads when healthy, weaker reads during failures\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The framework explains a symptom CAP cannot. A team picks a strongly consistent multi-region database, nothing is failing, and every write still takes as long as a round trip between regions. That is the EC side of the trade, paid on each request.\u003c/p>\u003cp>Labels describe a configuration more than a product. A store such as Cassandra can move toward the consistent end by raising its read and write quorum levels. Use the framework to ask two separate questions of each workload: what should happen during a partition, and how much latency is acceptable for fresher data the rest of the time.\u003c/p>","avoid":"","usage":["Nothing's down, so why does every write take 90 milliseconds?","We replicate synchronously across regions. In PACELC terms we chose consistency over latency, and that's the round trip."],"out":[20,1,29,38]},{"name":"Linearizability","section":2,"description":"Each operation appears to take effect at one instant between its start and end, in an order that respects real time.","body":"\u003cp>A consistency model in which every operation appears to take effect atomically at a single instant between its invocation and its response. Maurice Herlihy and Jeannette Wing defined it in 1990. To clients, the object behaves as if one copy of the data existed, even with several replicas (\u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> holding copies).\u003c/p>\u003cp>Formally, a history of operations is linearizable if they can be arranged in one total order that meets two conditions. The order must be legal for the object, so each read returns the latest value written before it. It must also respect real time: if operation A completes before operation B starts, A comes before B. Here \u003ccode>x\u003c/code> starts at 0:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Time\u003c/th>\u003cth>Client A\u003c/th>\u003cth>Client B\u003c/th>\u003cth>Client C\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ccode>write(x, 1)\u003c/code> starts\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003ccode>read(x)\u003c/code> returns 0 or 1\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ccode>write(x, 1)\u003c/code> returns\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003ccode>read(x)\u003c/code> must return 1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A read that overlaps a write may return either value. Once any read returns the new value, every read starting after it must return that value or a later one.\u003c/p>\u003cp>It is defined per operation on a single object, unlike serializability (transactions appear to run one at a time, with no real-time requirement). The combination of the two is called strict serializability. Linearizability is also composable: if each object is linearizable, the system of objects is too. \u003ca href=\"#Sequential%20consistency\" data-term=\"Sequential consistency\">Sequential consistency\u003c/a> lacks this property.\u003c/p>\u003cp>Without linearizability, a client can update a value, tell another client, and that client can still read the old value from a lagging replica. Locks, \u003ca href=\"#Leader%20election\" data-term=\"Leader election\">leader election\u003c/a> and uniqueness checks all rely on this guarantee. Providing it requires coordination, usually \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a>, which adds latency. By the \u003ca href=\"#CAP%20theorem\" data-term=\"CAP theorem\">CAP theorem\u003c/a>, it also cannot remain available on both sides of a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a>.\u003c/p>","avoid":"","usage":["I acquired the lock, but another worker read it as free a moment later.","Then those reads aren't linearizable. They're probably hitting a follower. Lock checks have to go through the consensus path."],"out":[1,23,42,38,20,3]},{"name":"Sequential consistency","section":2,"description":"All clients see operations in one agreed order that preserves each client's own order, without respecting real time.","body":"\u003cp>A consistency model in which all operations appear in one total order that every client agrees on, and each client's own operations appear in that order in the sequence the client issued them
