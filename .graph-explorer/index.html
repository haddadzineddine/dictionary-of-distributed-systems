. Leslie Lamport defined it in 1979, originally for multiprocessor memory.\u003c/p>\u003cp>It is weaker than \u003ca href=\"#Linearizability\" data-term=\"Linearizability\">linearizability\u003c/a> in one specific way. Linearizability requires the agreed order to match real time, while sequential consistency does not. An operation may appear to take effect before it started or after it finished.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Requirement\u003c/th>\u003cth>Linearizable\u003c/th>\u003cth>Sequentially consistent\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>One total order agreed by all clients\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Each client's own order preserved\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Order respects real time across clients\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Composable across objects\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Here is a history that is sequentially consistent but not linearizable. Suppose \u003ccode>x\u003c/code> starts at 0. Client A writes \u003ccode>x = 1\u003c/code> and the write returns. Later, client B reads \u003ccode>x\u003c/code> and gets 0. Placing B's read before A's write yields a valid single order, so sequential consistency allows it. Linearizability forbids it, since A's write finished before B's read began. What B cannot do is read 1 and then read 0 afterwards, because that would contradict any single order.\u003c/p>\u003cp>This produces a recognizable surprise. One service finishes a write and tells another over a queue or an HTTP call, and the second service reads stale data even though the store is meeting its guarantee. The notification traveled through a channel the storage system cannot see.\u003c/p>\u003cp>ZooKeeper shows the model in practice: updates are applied in a single order, but a client reading from a follower can see data that is behind the leader. Clients that need a fresher view call \u003ccode>sync\u003c/code> before reading.\u003c/p>","avoid":"","usage":["Service A committed the config, then called service B, and B read the old version.","The store is only sequentially consistent, so B's read can be ordered before the write. Have B call sync first."],"out":[22]},{"name":"Causal consistency","section":2,"description":"All nodes see causally related operations in the same order, while concurrent operations may appear in different orders.","body":"\u003cp>A consistency model in which every \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> sees causally related operations in the same order, while concurrent operations may be seen in different orders. Two operations are causally related if one could have influenced the other, as defined by the \u003ca href=\"#Happens-before\" data-term=\"Happens-before\">happens-before\u003c/a> relation. A client's earlier operations precede its later ones, and a write precedes any read that observes it.\u003c/p>\u003cp>Consider a comment thread. Ana posts a question (W1). Ben reads it and posts an answer (W2). Cleo, who has seen neither, posts an unrelated comment (W3). W1 causally precedes W2, and W3 is concurrent with both.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Order seen by a replica\u003c/th>\u003cth>Allowed?\u003c/th>\u003cth>Reason\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>W1, W2, W3\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>W1 is before W2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W3, W1, W2\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>W3 is concurrent, so it can go anywhere\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W1, W3, W2\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>W1 is before W2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W2, W1, W3\u003c/td>\u003ctd>No\u003c/td>\u003ctd>The answer appears before its question\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>This model prevents the anomaly in which a reply shows up with no visible question, or a user removes a colleague from a shared album and then posts a photo, only for the colleague to see the photo because the two updates arrived in the opposite order.\u003c/p>\u003cp>Causal consistency sits between \u003ca href=\"#Eventual%20consistency\" data-term=\"Eventual consistency\">eventual consistency\u003c/a> and \u003ca href=\"#Sequential%20consistency\" data-term=\"Sequential consistency\">sequential consistency\u003c/a>. It includes the session guarantees \u003ca href=\"#Read-your-writes\" data-term=\"Read-your-writes\">read-your-writes\u003c/a> and \u003ca href=\"#Monotonic%20reads\" data-term=\"Monotonic reads\">monotonic reads\u003c/a>. Unlike \u003ca href=\"#Linearizability\" data-term=\"Linearizability\">linearizability\u003c/a>, it can keep serving during a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a>, provided each client stays with a replica (a node holding a copy of the data) that has the client's history.\u003c/p>\u003cp>Implementations track dependencies, often with a \u003ca href=\"#Vector%20clock\" data-term=\"Vector clock\">vector clock\u003c/a> or explicit lists of the writes each update depends on, and delay applying an update until its dependencies have arrived. Concurrent writes to the same key still conflict, so the system also needs a merge rule.\u003c/p>","avoid":"","usage":["Some users see replies to comments that don't exist yet.","Our replicas apply writes in arrival order. We need causal consistency, so a reply waits until its parent comment is there."],"out":[1,14,25,23,26,27,22,3,17]},{"name":"Eventual consistency","section":2,"description":"If updates stop, all replicas eventually converge to the same value. Nothing is promised about reads before then.","body":"\u003cp>A consistency model which promises that if no new updates are made to a data item, all replicas (\u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> holding copies of it) will eventually return the same value. It makes no statement about how long that takes or what a read returns in the meantime.\u003c/p>\u003cp>Formally this is a liveness property: it says something good will happen eventually, and no finite observation can violate it. A read that returns stale data is allowed. So is a read that returns a newer value followed by one that returns an older value. The model also says nothing about which value replicas converge on when writes conflict, so the system needs a rule such as \u003ca href=\"#Last-write-wins\" data-term=\"Last-write-wins\">last-write-wins\u003c/a> or a \u003ca href=\"#CRDT\" data-term=\"CRDT\">CRDT\u003c/a>.\u003c/p>\u003cp>Systems choose it because a replica can answer from local data with no coordination. Reads and writes stay fast and can continue during a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a>, which is the available side of the \u003ca href=\"#CAP%20theorem\" data-term=\"CAP theorem\">CAP theorem\u003c/a>.\u003c/p>\u003cp>The cost falls on application code, with symptoms such as:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Symptom\u003c/th>\u003cth>What happened\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A saved change disappears on refresh\u003c/td>\u003ctd>The read hit a replica without the write\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A like count goes up and down between loads\u003c/td>\u003ctd>Requests hit replicas at different states\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A new account &quot;doesn't exist&quot; right after signup\u003c/td>\u003ctd>The next service read from a lagging replica\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A deleted item reappears\u003c/td>\u003ctd>A replica missed the delete and spread old data\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Replicas converge through background mechanisms such as \u003ca href=\"#Read%20repair\" data-term=\"Read repair\">read repair\u003c/a>, \u003ca href=\"#Anti-entropy\" data-term=\"Anti-entropy\">anti-entropy\u003c/a>, \u003ca href=\"#Hinted%20handoff\" data-term=\"Hinted handoff\">hinted handoff\u003c/a> and a \u003ca href=\"#Gossip%20protocol\" data-term=\"Gossip protocol\">gossip protocol\u003c/a>.\u003c/p>\u003cp>To work with the model, decide which reads can tolerate staleness. Add session guarantees where a user notices, such as \u003ca href=\"#Read-your-writes\" data-term=\"Read-your-writes\">read-your-writes\u003c/a> and \u003ca href=\"#Monotonic%20reads\" data-term=\"Monotonic reads\">monotonic reads\u003c/a>, and send the few reads that must be current to a stronger path.\u003c/p>","avoid":"","usage":["QA says the settings page sometimes shows the old value after saving.","The profile store is eventually consistent and that read hits a replica. Route it to the leader for a user's own settings."],"out":[1,36,37,3,20,32,33,31,35,26,27]},{"name":"Read-your-writes","section":2,"description":"A session guarantee that once a client writes a value, its later reads see that write or something newer.","body":"\u003cp>A session guarantee that once a client has written a value, that client's later reads will return that write or a newer one. It was described by Douglas Terry and colleagues in 1994 as one of four session guarantees for weakly consistent systems. It is also called read-after-write consistency.\u003c/p>\u003cp>The symptom is familiar. A user edits their profile, presses save, sees the page reload, and the old value is back. The write went to the leader, the reload read from a replica (a \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> holding a copy of the data) that had not received it yet, and a few seconds later the new value appears.\u003c/p>\u003cp>The guarantee applies per session. Other users may still see the old value for a while, which is acceptable under \u003ca href=\"#Eventual%20consistency\" data-term=\"Eventual consistency\">eventual consistency\u003c/a>. It needs less coordination than \u003ca href=\"#Linearizability\" data-term=\"Linearizability\">linearizability\u003c/a>, since only the writer's own view needs protecting.\u003c/p>\u003cp>Common ways to provide it:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Read from leader\u003c/td>\u003ctd>Send reads of a user's own data to the leader\u003c/td>\u003ctd>Adds load to the leader\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Time window\u003c/td>\u003ctd>Route a user to the leader for N seconds after a write\u003c/td>\u003ctd>Fails if lag exceeds N\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Version token\u003c/td>\u003ctd>Client keeps its write's log position, and replicas serve the read only once caught up\u003c/td>\u003ctd>Requires passing a token through the stack\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sticky routing\u003c/td>\u003ctd>Keep the session on the replica that took its writes\u003c/td>\u003ctd>Breaks when that replica fails\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>For a user on several devices, store the version token server-side, because a token in one browser's cookie does not cover a write made on a phone.\u003c/p>\u003cp>Seeing another user's update and then losing it on the next read is a separate anomaly, covered by \u003ca href=\"#Monotonic%20reads\" data-term=\"Monotonic reads\">monotonic reads\u003c/a>.\u003c/p>","avoid":"","usage":["Users keep reporting that their display name reverts after saving.","We're breaking read-your-writes. The profile page reads from a replica. Pin that user to the primary for a short window after any update."],"out":[1,25,22,27]},{"name":"Monotonic reads","section":2,"description":"A session guarantee that once a client has seen a value, later reads never return an older state.","body":"\u003cp>A session guarantee that once a client has read a value, its later reads will return that value or a newer one. It is one of the four session guarantees from Douglas Terry and colleagues in 1994.\u003c/p>\u003cp>The symptom is data that appears and then vanishes. A user refreshes a page and sees a new comment, refreshes again and it has gone, and refreshes a third time and it is back. No data changed. A load balancer sent each request to a different replica (a \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> holding a copy of the data), and those replicas were at different points in replication:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Refresh\u003c/th>\u003cth>Replica\u003c/th>\u003cth>Replica's lag\u003c/th>\u003cth>New comment visible?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>A\u003c/td>\u003ctd>0 seconds\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>B\u003c/td>\u003ctd>5 seconds\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>A\u003c/td>\u003ctd>0 seconds\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Under \u003ca href=\"#Eventual%20consistency\" data-term=\"Eventual consistency\">eventual consistency\u003c/a> this is permitted, but it looks like a bug to users, and it can break application logic. A worker that reads a job as finished and then reads it as pending may run it again.\u003c/p>\u003cp>There are two common ways to provide the guarantee. The first pins each session to one replica, for example by hashing the user ID to choose it. If that replica fails, the session can go backward. The second has the client remember the highest log position or version it has seen and send it with each read, so a replica that is further behind waits, or the request goes to another replica.\u003c/p>\u003cp>Monotonic reads does not promise fresh data. A client pinned to a replica ten minutes behind satisfies the guarantee as long as its view never moves backward. It also does not imply \u003ca href=\"#Read-your-writes\" data-term=\"Read-your-writes\">read-your-writes\u003c/a>, because the client's own write may not have reached that replica. \u003ca href=\"#Causal%20consistency\" data-term=\"Causal consistency\">Causal consistency\u003c/a> includes each of them.\u003c/p>","avoid":"","usage":["The order shows as shipped, then processing, then shipped again when I refresh.","That's a monotonic reads violation. The reads are bouncing between replicas with different lag. Let's route each session to one replica."],"out":[1,25,26,24]},{"name":"State machine replication","section":3,"description":"Keeping replicas identical by having each apply the same deterministic commands in the same order.","body":"\u003cp>A technique for keeping several copies of a service identical by having each copy apply the same deterministic commands in the same order. If every replica (a \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> holding a copy) starts in the same state and processes the same sequence of inputs, every replica ends in the same state. Leslie Lamport introduced the approach in 1978, and Fred Schneider's 1990 tutorial is a standard reference.\u003c/p>\u003cp>The hard part is agreeing on the sequence, which is a \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a> problem. Protocols such as \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a> and Multi-\u003ca href=\"#Paxos\" data-term=\"Paxos\">Paxos\u003c/a> maintain a replicated log of commands. A typical leader-based write looks like this:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Sends a command to the leader\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Leader\u003c/td>\u003ctd>Appends it to its log and sends it to followers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Followers\u003c/td>\u003ctd>Store the entry durably and acknowledge\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Leader\u003c/td>\u003ctd>Marks it committed once a majority has stored it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Each replica\u003c/td>\u003ctd>Applies committed entries to its state in log order\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Leader\u003c/td>\u003ctd>Returns the result to the client\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>With 2f + 1 replicas, this tolerates f \u003ca href=\"#Crash%20failure\" data-term=\"Crash failure\">crash failures\u003c/a>.\u003c/p>\u003cp>Commands must be deterministic, and violations cause replicas to diverge silently. If a command calls \u003ccode>now()\u003c/code> or \u003ccode>random()\u003c/code>, or iterates over a hash map whose order varies, each replica computes a different result from the same log. The usual fix is for the leader to resolve such values first and put the concrete result into the log entry.\u003c/p>\u003cp>Two practical details follow. Logs grow without limit, so replicas periodically save a snapshot of their state and discard earlier entries. Clients also retry after timeouts, which can place one command in the log twice, so commands carry a client ID and sequence number that give \u003ca href=\"#Idempotency\" data-term=\"Idempotency\">idempotency\u003c/a> when applied.\u003c/p>","avoid":"","usage":["Two replicas have different balances, but their logs are identical.","Then something in the apply path isn't deterministic. State machine replication only works if the same log produces the same state. Check for timestamps."],"out":[1,38,41,40,5,51]},{"name":"Quorum","section":3,"description":"The minimum number of nodes that must respond before an operation counts, chosen so that operations overlap.","body":"\u003cp>The minimum number of \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> that must take part before an operation counts as successful. Quorums let a system proceed without waiting for every node, while ensuring that any two operations that need to see each other share at least one node.\u003c/p>\u003cp>The common form is a majority, floor(N/2) + 1 of N nodes. Any two majorities overlap, so two conflicting decisions cannot both gather one. This is why \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a> and \u003ca href=\"#Paxos\" data-term=\"Paxos\">Paxos\u003c/a> use majorities and why a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a> can leave at most one side able to make progress.\u003c/p>\u003cp>Replicated stores often tune separate sizes: N replicas (nodes holding copies), W acknowledgments for a write, and R responses for a read. If R + W &gt; N, every read set overlaps every write set. With N = 3:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>W\u003c/th>\u003cth>R\u003c/th>\u003cth>Overlap?\u003c/th>\u003cth>Node losses writes survive\u003c/th>\u003cth>Node losses reads survive\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>0\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>2\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>No\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Overlap alone does not give \u003ca href=\"#Linearizability\" data-term=\"Linearizability\">linearizability\u003c/a>. During an in-progress write, one read can reach a replica with the new value and a later read can miss it, so values appear to go backward. Closing that gap requires readers to write the newest value back to a quorum before returning, and conflicting writes need a version order.\u003c/p>\u003cp>Cluster size determines how many failures a majority can survive. A four-node majority is three, so it tolerates one failure, the same as a three-node cluster. This is why \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a> clusters usually have an odd size. A three-node cluster that has lost two nodes stops accepting writes, because the remaining node cannot tell whether it is on the minority side of a partition.\u003c/p>","avoid":"","usage":["Two of the three etcd nodes are down and all writes are hanging. Can we force it?","It has lost quorum, so it's refusing on purpose. Restore a node. Forcing it risks losing committed data."],"out":[1,41,40,3,22,38]},{"name":"Sloppy quorum","section":3,"description":"A relaxed quorum that lets fallback nodes accept writes when designated replicas are unreachable, weakening read overlap.","body":"\u003cp>A relaxed \u003ca href=\"#Quorum\" data-term=\"Quorum\">quorum\u003c/a> in which a write can be acknowledged by any reachable \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a>, including nodes that are not among the key's designated replicas (the nodes assigned to hold its copies). Amazon's Dynamo paper described the technique in 2007. It keeps writes succeeding when too few of the designated replicas can be reached.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>During a failure\u003c/th>\u003cth>Strict quorum\u003c/th>\u003cth>Sloppy quorum\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Who can acknowledge\u003c/td>\u003ctd>Designated replicas only\u003c/td>\u003ctd>Any W reachable nodes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Write availability\u003c/td>\u003ctd>Fails below W designated replicas\u003c/td>\u003ctd>Continues while W nodes are reachable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R + W &gt; N overlap\u003c/td>\u003ctd>Guaranteed\u003c/td>\u003ctd>Not guaranteed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>After recovery\u003c/td>\u003ctd>Normal replication resumes\u003c/td>\u003ctd>\u003ca href=\"#Hinted%20handoff\" data-term=\"Hinted handoff\">Hinted handoff\u003c/a> moves data back\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A sloppy quorum weakens read overlap. Say a key lives on A, B and C, with N = 3, W = 2 and R = 2. During a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a>, a client can reach only C, D and E. A sloppy write lands on C and D, and the client receives a success. After the partition heals, a read contacts A and B before the handoff has run. Both hold the old value, so the read returns stale data even though R + W &gt; N.\u003c/p>\u003cp>A sloppy quorum is therefore a durability and availability measure, and it provides only \u003ca href=\"#Eventual%20consistency\" data-term=\"Eventual consistency\">eventual consistency\u003c/a> until repair completes. The data exists on W nodes, but not necessarily on nodes a reader will ask.\u003c/p>\u003cp>Products differ. Riak exposes settings that require acknowledgments from primary replicas. Cassandra stores hints for down replicas but does not count them toward its consistency levels, except the weakest level, \u003ccode>ANY\u003c/code>. Check how your store behaves before relying on quorum settings for correctness.\u003c/p>","avoid":"","usage":["We write and read at quorum, so how did this read come back stale?","Sloppy quorum. During the outage the write landed on fallback nodes, and the read hit replicas that hadn't received the handoff yet."],"out":[29,1,31,3,25]},{"name":"Hinted handoff","section":3,"description":"Another node temporarily stores a write for an unreachable replica and delivers it when that replica returns.","body":"\u003cp>A repair technique in which a reachable \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> temporarily stores a write meant for an unreachable replica (a node assigned to hold a copy of the data), along with a hint naming the intended owner. When the owner comes back, the stored write is delivered to it. Leaderless stores such as Dynamo and Cassandra use this technique, and it is what moves data back after a \u003ca href=\"#Sloppy%20quorum\" data-term=\"Sloppy quorum\">sloppy quorum\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Coordinator\u003c/td>\u003ctd>Sends a write and finds replica C unreachable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Hint holder\u003c/td>\u003ctd>Stores the write with a hint saying it belongs to C\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Hint holder\u003c/td>\u003ctd>Learns C is back, through a \u003ca href=\"#Failure%20detector\" data-term=\"Failure detector\">failure detector\u003c/a> or \u003ca href=\"#Gossip%20protocol\" data-term=\"Gossip protocol\">gossip protocol\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Hint holder\u003c/td>\u003ctd>Replays the write to C\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Hint holder\u003c/td>\u003ctd>Deletes the hint once C acknowledges\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The hint holder varies by product. In the Dynamo design it is a fallback node, and in Cassandra it is normally the coordinator (the node handling the client's request).\u003c/p>\u003cp>Hinted handoff shortens the time a returning replica is out of date, but it is a best-effort mechanism. A hint holder can fail before delivering, which loses the hint. Stores also stop collecting hints after a configurable window so that a long outage does not fill their disks. The recognizable failure is a node that returns after extended maintenance, reports healthy, and serves stale or missing rows, because the outage outlasted the hint window. Any outage longer than that window needs a full \u003ca href=\"#Anti-entropy\" data-term=\"Anti-entropy\">anti-entropy\u003c/a> repair before the node can be trusted.\u003c/p>\u003cp>Replay also creates load. When a node returns, several peers may send it their stored hints at once, on top of normal traffic, which can slow it enough to look failed again.\u003c/p>","avoid":"","usage":["Node six was offline for two days. It's back, so we're fine, right?","Hinted handoff only covers the first few hours of that. Run a full repair before it serves \u003ca href=\"#Quorum\" data-term=\"Quorum\">quorum\u003c/a> reads."],"out":[1,30,9,35,33,29]},{"name":"Read repair","section":3,"description":"Fixing stale replicas during a read, by comparing their responses and writing the newest version back.","body":"\u003cp>A technique that fixes out-of-date replicas (the \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> holding copies of a key) as a side effect of reading. When a read contacts several replicas and their versions disagree, the coordinator (the node handling the request) sends the newest version to the replicas that returned an older one.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Coordinator\u003c/td>\u003ctd>Sends the read to R replicas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Replicas\u003c/td>\u003ctd>Return their value, or a digest (a short hash) of it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Coordinator\u003c/td>\u003ctd>Compares versions and identifies the newest\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Coordinator\u003c/td>\u003ctd>Writes the newest value to the stale replicas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Coordinator\u003c/td>\u003ctd>Returns the newest value to the client\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Steps 4 and 5 can happen in either order, and the choice changes the guarantee. In blocking read repair, the coordinator waits until a write \u003ca href=\"#Quorum\" data-term=\"Quorum\">quorum\u003c/a> holds the value before responding, so a later quorum read cannot return the older version. In asynchronous read repair, the client gets a faster response, but a following read can still see the old value.\u003c/p>\u003cp>Read repair produces a recognizable pattern in debugging. A read from one replica returns an old value, the next attempt returns the correct one, and by the time someone investigates, all replicas agree. The first read triggered the fix and removed the evidence.\u003c/p>\u003cp>The technique only repairs keys that are read. Rarely read data can stay inconsistent indefinitely, so it is paired with background \u003ca href=\"#Anti-entropy\" data-term=\"Anti-entropy\">anti-entropy\u003c/a>.\u003c/p>\u003cp>Read repair is only as correct as its version comparison. With \u003ca href=\"#Last-write-wins\" data-term=\"Last-write-wins\">last-write-wins\u003c/a>, a write carrying a timestamp inflated by \u003ca href=\"#Clock%20skew\" data-term=\"Clock skew\">clock skew\u003c/a> is treated as newest and copied over a genuinely newer value. Stores that detect concurrent versions, for example with a \u003ca href=\"#Vector%20clock\" data-term=\"Vector clock\">vector clock\u003c/a>, must merge them or keep both.\u003c/p>","avoid":"","usage":["The stale row fixed itself before I could reproduce it.","Probably read repair. Your first query found the mismatch and updated the lagging replica. Check the repair metrics for that table."],"out":[1,29,33,36,11,17]},{"name":"Anti-entropy","section":3,"description":"A background process that compares replicas and copies over missing or outdated data, whether or not it is being read.","body":"\u003cp>A background process that compares replicas (the \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> holding copies of the same data) and copies over whatever is missing or out of date. The name refers to reducing disorder between copies. It was described in work on replicated databases at Xerox PARC by Demers and colleagues in 1987.\u003c/p>\u003cp>Anti-entropy is the backstop among the convergence mechanisms in an \u003ca href=\"#Eventual%20consistency\" data-term=\"Eventual consistency\">eventually consistent\u003c/a> store, since it covers data the others miss:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mechanism\u003c/th>\u003cth>When it runs\u003c/th>\u003cth>What it covers\u003c/th>\u003cth>Gap\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Hinted%20handoff\" data-term=\"Hinted handoff\">Hinted handoff\u003c/a>\u003c/td>\u003ctd>When a replica returns\u003c/td>\u003ctd>Writes during a short outage\u003c/td>\u003ctd>Lost hints, long outages\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Read%20repair\" data-term=\"Read repair\">Read repair\u003c/a>\u003c/td>\u003ctd>During reads\u003c/td>\u003ctd>Keys that are read\u003c/td>\u003ctd>Data nobody reads\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Anti-entropy\u003c/td>\u003ctd>On a schedule or on demand\u003c/td>\u003ctd>All data in scope\u003c/td>\u003ctd>Uses disk, CPU and network\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Comparing full datasets over the network would be too expensive, so implementations exchange summaries. A \u003ca href=\"#Merkle%20tree\" data-term=\"Merkle tree\">Merkle tree\u003c/a> lets two replicas locate differing key ranges by exchanging a small number of hashes, then transfer only those ranges. Exchanges can push data, pull data, or do both.\u003c/p>\u003cp>Repair frequency has a correctness consequence around deletes. Replicated stores usually record a delete as a tombstone (a marker saying the key was deleted) and purge it after a retention period. If a replica misses the delete and repair does not run before the tombstone is purged, that replica still holds the old row and no marker exists to override it. The next repair copies the row back to the others, and deleted data reappears. In Cassandra, for this reason, repair must complete within the \u003ccode>gc_grace_seconds\u003c/code> window.\u003c/p>\u003cp>Repairs are heavy operations, so schedule them with limits and stagger them across nodes. Run one after any outage longer than the hint window, and alert when a scheduled repair has not completed.\u003c/p>","avoid":"","usage":["Customers deleted those records last month, and now they're back.","Sounds like tombstones expired before anti-entropy reached that replica. When did repair last finish on this cluster?"],"out":[1,25,31,32,34]},{"name":"Merkle tree","section":3,"description":"A tree of hashes that lets two parties find which parts of large datasets differ by exchanging only a few hashes.","body":"\u003cp>A tree of hashes in which each leaf is the hash of a block of data and each parent is the hash of its children. The root therefore summarizes the entire dataset, and any change to a block changes every hash on the path up to the root. Ralph Merkle devised the structure around 1979.\u003c/p>\u003cp>In a \u003ca href=\"#Distributed%20system\" data-term=\"Distributed system\">distributed system\u003c/a>, Merkle trees answer a specific question: which parts of two large datasets differ? Sending all the data, or even all the keys, between replicas (\u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> holding copies) would consume a large amount of bandwidth just to confirm they mostly match. Two nodes can instead compare trees from the top down:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Each node builds a tree over the same key ranges\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>The nodes compare root hashes. If equal, the ranges match\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>If different, they compare the hashes of the root's children\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>They descend only into subtrees whose hashes differ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>At the leaves, they exchange the data for mismatched ranges\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>If only one leaf differs, the comparison follows a single path, so the number of levels visited grows with the logarithm of the number of leaves. This is why \u003ca href=\"#Anti-entropy\" data-term=\"Anti-entropy\">anti-entropy\u003c/a> in stores such as Dynamo and Cassandra uses these trees. Git and blockchains use the same structure or close variants.\u003c/p>\u003cp>Matching hashes indicate matching data with overwhelming probability, not certainty.\u003c/p>\u003cp>Tree granularity is a practical trade-off. If each leaf covers many keys, the tree stays small, but one differing key forces the whole range to be transferred, a problem called overstreaming. It shows up as a repair moving more data than differed. More leaves reduce that waste and use more memory.\u003c/p>","avoid":"","usage":["Repair streamed 200 GB, but only a few thousand rows were out of sync.","The Merkle tree leaves are too coarse, so one bad key resends the whole range. Try increasing the tree depth on that table."],"out":[0,1,33]},{"name":"Gossip protocol","section":3,"description":"Nodes periodically exchange state with random peers, so information spreads through a cluster like an epidemic.","body":"\u003cp>A communication method in which each \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> periodically exchanges information with a few randomly chosen peers. Those peers pass it on in later rounds, so an update spreads through the cluster the way an infection spreads through a population. These are also called epidemic protocols.\u003c/p>\u003cp>Each round, a node picks one or a few peers and does one of the following:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Style\u003c/th>\u003cth>What is exchanged\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Push\u003c/td>\u003ctd>The node sends the peer what it knows\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pull\u003c/td>\u003ctd>The node asks the peer for what it is missing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Push-pull\u003c/td>\u003ctd>Both sides send each other what the other lacks\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Because the number of informed nodes grows roughly exponentially at first, an update reaches all N nodes in about O(log N) rounds with high probability. Each node sends a fixed amount per round, and there is no central coordinator. Random peer selection also routes around failed nodes and many \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partitions\u003c/a> that are not complete.\u003c/p>\u003cp>Gossip commonly carries cluster membership, node health and metadata such as which node owns which data. Cassandra and Consul are examples. It often feeds a \u003ca href=\"#Failure%20detector\" data-term=\"Failure detector\">failure detector\u003c/a>, since peers can report on nodes they have heard from recently.\u003c/p>\u003cp>The trade-off is that delivery is probabilistic and delayed, giving \u003ca href=\"#Eventual%20consistency\" data-term=\"Eventual consistency\">eventual consistency\u003c/a> for the gossiped state. During a rollout, different nodes can briefly hold different views of the cluster, so one routes a request to a member that another already considers gone.\u003c/p>\u003cp>Removals need particular care. A node that was removed can reappear because a peer still holds its old entry and gossips it back. Protocols prevent this by attaching a generation or version number to each entry, and by keeping a removal marker long enough for it to spread everywhere.\u003c/p>","avoid":"","usage":["We decommissioned that node an hour ago, but it keeps showing up in the member list.","A peer's still gossiping its old state. Check that the removal marker has propagated before restarting anything."],"out":[1,3,9,25]},{"name":"Last-write-wins","section":3,"description":"A conflict rule that keeps the write with the highest timestamp and silently discards the others.","body":"\u003cp>A conflict resolution rule that keeps the write with the highest timestamp and discards the others. When replicas (the \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> holding copies of a key) hold different versions, each compares timestamps and retains the winner, with a tie-breaker such as node ID. Every replica applies the same rule, so all converge on one value. This gives \u003ca href=\"#Eventual%20consistency\" data-term=\"Eventual consistency\">eventual consistency\u003c/a> with little machinery, and it is the default in stores such as Cassandra.\u003c/p>\u003cp>The rule's weakness is that &quot;last&quot; means highest timestamp, which may not be the most recent write. With \u003ca href=\"#Clock%20skew\" data-term=\"Clock skew\">clock skew\u003c/a>, an older write can beat a newer one:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Real order\u003c/th>\u003cth>Node\u003c/th>\u003cth>Node's clock\u003c/th>\u003cth>Write\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>First\u003c/td>\u003ctd>A\u003c/td>\u003ctd>10:00:00.300\u003c/td>\u003ctd>\u003ccode>status = &quot;old&quot;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Second, 100 ms later\u003c/td>\u003ctd>B\u003c/td>\u003ctd>10:00:00.100\u003c/td>\u003ctd>\u003ccode>status = &quot;new&quot;\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Node A's clock runs 300 ms ahead, so its earlier write has the higher timestamp. The store keeps \u003ccode>&quot;old&quot;\u003c/code>, and the write of \u003ccode>&quot;new&quot;\u003c/code> disappears even though its client received a success.\u003c/p>\u003cp>The rule also loses data when clocks are perfect. If two users edit a record concurrently, in the \u003ca href=\"#Happens-before\" data-term=\"Happens-before\">happens-before\u003c/a> sense, then neither saw the other's change, and one edit is dropped with no error. Whole-record writes make it worse: two users changing different fields overwrite each other's work.\u003c/p>\u003cp>Several measures reduce the risk:\u003c/p>\u003cul>\u003cli>Store each field separately, so edits to different fields do not conflict.\u003c/li>\u003cli>Use immutable records with unique keys, so no two writes target the same key.\u003c/li>\u003cli>Use compare-and-set (write only if the value is unchanged) where a lost update is unacceptable.\u003c/li>\u003cli>Use a \u003ca href=\"#Hybrid%20logical%20clock\" data-term=\"Hybrid logical clock\">hybrid logical clock\u003c/a>, so a causally later write gets a higher timestamp.\u003c/li>\u003cli>Use a \u003ca href=\"#CRDT\" data-term=\"CRDT\">CRDT\u003c/a> or a \u003ca href=\"#Vector%20clock\" data-term=\"Vector clock\">vector clock\u003c/a> when concurrent updates must be preserved.\u003c/li>\u003c/ul>","avoid":"","usage":["Support says two agents updated the ticket, and one note is gone.","The store uses last-write-wins on the whole row, so the second save replaced the first. We should move notes into their own records."],"out":[1,25,11,14,18,37,17]},{"name":"CRDT","section":3,"description":"Conflict-free replicated data type. A structure whose replicas can update independently and always merge to the same state.","body":"\u003cp>Conflict-free replicated data type: a data structure whose copies can be updated independently, with no coordination, and that converge when they exchange updates. Marc Shapiro and colleagues formalized the idea in 2011. The guarantee is called strong \u003ca href=\"#Eventual%20consistency\" data-term=\"Eventual consistency\">eventual consistency\u003c/a>: any two replicas (the \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> holding copies) that have received the same set of updates are in the same state.\u003c/p>\u003cp>State-based CRDTs send their state and merge it with a commutative, associative and idempotent function, so messages can repeat or arrive in any order, which suits \u003ca href=\"#At-least-once%20delivery\" data-term=\"At-least-once delivery\">at-least-once delivery\u003c/a>. Operation-based CRDTs send individual operations that commute when concurrent, and rely on a delivery layer that delivers each one once and, for many types, in causal order.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Supports\u003c/th>\u003cth>How it merges\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>G-Counter\u003c/td>\u003ctd>Increment\u003c/td>\u003ctd>One count per node, merged by taking each maximum\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PN-Counter\u003c/td>\u003ctd>Increment, decrement\u003c/td>\u003ctd>Two G-Counters, value is increments minus decrements\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OR-Set\u003c/td>\u003ctd>Add, remove\u003c/td>\u003ctd>Each add gets a unique tag, and remove deletes only the tags it saw, so a concurrent add survives\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LWW-Register\u003c/td>\u003ctd>Set a value\u003c/td>\u003ctd>Highest timestamp wins, as in \u003ca href=\"#Last-write-wins\" data-term=\"Last-write-wins\">last-write-wins\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>CRDTs fit collaborative editing and offline-first apps, where a user keeps working during a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a> and merges later. Automerge and Yjs are examples of libraries.\u003c/p>\u003cp>Convergence does not mean the merged result is what users wanted. Two people editing one sentence can produce an interleaved result that is valid but unreadable. A plain CRDT also cannot enforce global invariants, such as &quot;balance never goes below zero&quot; or &quot;usernames are unique&quot;, because each replica accepts updates before hearing from the others. Those checks need \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a> or quotas allocated to each replica in advance.\u003c/p>","avoid":"","usage":["Can we make the inventory count a CRDT so warehouses can work offline?","The count would converge, but two warehouses could both sell the last unit. A plain counter CRDT can't enforce stock never going negative."],"out":[25,1,49,36,3,38]},{"name":"Consensus","section":4,"description":"The problem of getting a group of nodes to agree on one value, and never change it, even when some of them fail.","body":"\u003cp>The problem of getting a group of \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> to agree on a single value, even when some of them fail. Once the value is decided, it stays decided. A standard formal definition has three properties:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Property\u003c/th>\u003cth>Requirement\u003c/th>\u003cth>Type\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Agreement\u003c/td>\u003ctd>No two correct nodes decide different values\u003c/td>\u003ctd>Safety\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Validity\u003c/td>\u003ctd>The decided value was proposed by some node\u003c/td>\u003ctd>Safety\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Termination\u003c/td>\u003ctd>Every correct node eventually decides\u003c/td>\u003ctd>Liveness\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A safety property says nothing bad ever happens, and a liveness property says something good eventually happens. \u003ca href=\"#FLP%20impossibility\" data-term=\"FLP impossibility\">FLP impossibility\u003c/a> shows that a deterministic protocol cannot guarantee both in a fully asynchronous network with even one crash. Practical protocols such as \u003ca href=\"#Paxos\" data-term=\"Paxos\">Paxos\u003c/a> and \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a> therefore always preserve safety and rely on timing assumptions only for progress.\u003c/p>\u003cp>Many coordination tasks reduce to consensus: \u003ca href=\"#Leader%20election\" data-term=\"Leader election\">leader election\u003c/a>, agreeing on cluster membership, deciding a transaction's outcome, and ordering commands in \u003ca href=\"#State%20machine%20replication\" data-term=\"State machine replication\">state machine replication\u003c/a>. Repeating consensus for each slot of a log yields total order broadcast (delivering the same messages to all nodes in the same order), and the two problems are equivalent in the \u003ca href=\"#Crash%20failure\" data-term=\"Crash failure\">crash failure\u003c/a> model.\u003c/p>\u003cp>Tolerating f crash failures takes 2f + 1 nodes, because each decision needs a majority \u003ca href=\"#Quorum\" data-term=\"Quorum\">quorum\u003c/a> and any two majorities overlap.\u003c/p>\u003cp>When a three-node etcd cluster loses two members, the survivor stops accepting writes even though it is running. It cannot tell a crash from a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a>, and accepting writes could create a conflicting history. The protocol stops making progress so that it never disagrees with itself.\u003c/p>\u003cp>Each decision costs network round trips and durable disk writes, and adding voters adds to that cost. Systems therefore keep the voting group small and use it for metadata and coordination, with bulk data stored elsewhere.\u003c/p>","avoid":"","usage":["Why not run a two-node etcd cluster? It's cheaper than three.","A majority of two is two, so losing either node stops consensus. You'd pay for a second machine and tolerate zero failures."],"out":[1,39,40,41,42,28,5,29,3]},{"name":"FLP impossibility","section":4,"description":"No deterministic protocol can guarantee consensus in an asynchronous system if even one node may crash.","body":"\u003cp>A proof that no deterministic algorithm can guarantee \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a> in a fully asynchronous system if even one process may crash. It is named after Michael Fischer, Nancy Lynch and Michael Paterson, who published it in 1985.\u003c/p>\u003cp>The result depends on its exact assumptions:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Assumption\u003c/th>\u003cth>Meaning in the proof\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Asynchronous\u003c/td>\u003ctd>No bound on message delay or relative processing speed, and no clocks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reliable network\u003c/td>\u003ctd>Every message is eventually delivered, exactly once\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One crash\u003c/td>\u003ctd>At most one process may stop, at any point\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deterministic\u003c/td>\u003ctd>Each step is fully determined by a process's state and input\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Nontrivial\u003c/td>\u003ctd>Both possible decision values can be reached\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The difficulty comes from a process being unable to tell a crashed peer from a slow one. The proof shows that any such protocol has an initial state from which the outcome is not yet fixed, and that an adversarial schedule of message deliveries can keep it undecided forever.\u003c/p>\u003cp>FLP does not say consensus is unachievable in practice. It says no protocol in this model can guarantee termination in every possible execution. The non-terminating schedules can be made unlikely, and systems escape the result by changing an assumption:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>Added assumption\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Partial synchrony\u003c/td>\u003ctd>The network eventually behaves within time bounds\u003c/td>\u003ctd>\u003ca href=\"#Paxos\" data-term=\"Paxos\">Paxos\u003c/a>, \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Randomization\u003c/td>\u003ctd>\u003ca href=\"#Node\" data-term=\"Node\">Nodes\u003c/a> use coin flips, and terminate with probability 1\u003c/td>\u003ctd>Ben-Or's 1983 algorithm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Failure%20detector\" data-term=\"Failure detector\">Failure detector\u003c/a>\u003c/td>\u003ctd>An oracle that is eventually accurate enough\u003c/td>\u003ctd>Chandra-Toueg algorithm\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The practical consequence appears in how Raft and Paxos fail. Under bad timing, such as repeated \u003ca href=\"#Leader%20election\" data-term=\"Leader election\">leader election\u003c/a> rounds on an unstable network, a cluster may stop making progress for as long as the instability lasts. It will not return conflicting decisions.\u003c/p>","avoid":"","usage":["Can we prove our election always finishes within some time limit?","Not on an asynchronous network. FLP rules out guaranteed termination. We can prove it never elects two leaders per term, and use randomized timeouts so it converges in practice."],"out":[38,40,41,1,9,42]},{"name":"Paxos","section":4,"description":"Lamport's consensus protocol, in which proposers and a majority of acceptors choose one value in two phases.","body":"\u003cp>A \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a> protocol devised by Leslie Lamport and published in 1998. It lets a group of \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> choose one value while tolerating \u003ca href=\"#Crash%20failure\" data-term=\"Crash failure\">crash failures\u003c/a> of a minority, message loss and message delay.\u003c/p>\u003cp>Paxos defines three roles, and one server often plays all of them:\u003c/p>\u003cul>\u003cli>Proposers suggest values.\u003c/li>\u003cli>Acceptors vote on proposals.\u003c/li>\u003cli>Learners find out which value was chosen.\u003c/li>\u003c/ul>\u003cp>Single-decree Paxos decides one value in two phases:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phase\u003c/th>\u003cth>From → to\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1a Prepare\u003c/td>\u003ctd>Proposer → acceptors\u003c/td>\u003ctd>Proposer picks a unique number \u003ccode>n\u003c/code> and sends \u003ccode>prepare(n)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1b Promise\u003c/td>\u003ctd>Acceptor → proposer\u003c/td>\u003ctd>If \u003ccode>n\u003c/code> is above any prepare it has answered, the acceptor promises to ignore lower numbers and returns the highest-numbered proposal it has accepted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2a Accept\u003c/td>\u003ctd>Proposer → acceptors\u003c/td>\u003ctd>With promises from a majority, proposer sends \u003ccode>accept(n, v)\u003c/code>. \u003ccode>v\u003c/code> must be the value of the highest-numbered proposal returned, or its own value if none\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2b Accepted\u003c/td>\u003ctd>Acceptor → learners\u003c/td>\u003ctd>Acceptor accepts unless it has promised a number above \u003ccode>n\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A value is chosen once a majority of acceptors have accepted the same proposal. The rule in step 2a provides safety: any later proposer must learn of a possibly chosen value through the overlapping \u003ca href=\"#Quorum\" data-term=\"Quorum\">quorum\u003c/a> and propose it again. Acceptors must persist promises and acceptances to disk before replying, or a restart could break those promises.\u003c/p>\u003cp>Two proposers can block each other indefinitely by issuing ever-higher numbers, each invalidating the other's phase 1. A distinguished leader or randomized backoff makes this livelock unlikely.\u003c/p>\u003cp>Real systems need a sequence of decisions for \u003ca href=\"#State%20machine%20replication\" data-term=\"State machine replication\">state machine replication\u003c/a>. Multi-Paxos runs one instance per log slot, and a stable leader can skip phase 1 for later slots. \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a> was designed partly because the original papers leave these engineering details open.\u003c/p>","avoid":"","usage":["Throughput dropped to nothing and both servers are busy sending prepares.","Dueling proposers, preempting each other in phase 1. Add a stable leader or randomized backoff."],"out":[38,1,5,29,28,41]},{"name":"Raft","section":4,"description":"A leader-based consensus protocol for replicating a log, designed to be easier to understand than Paxos.","body":"\u003cp>A \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a> protocol for maintaining a replicated log, published by Diego Ongaro and John Ousterhout in 2014 with understandability as an explicit goal. It provides fault tolerance comparable to Multi-\u003ca href=\"#Paxos\" data-term=\"Paxos\">Paxos\u003c/a>, and etcd and Consul use it.\u003c/p>\u003cp>Each \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> is in one of three roles:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Follower\u003c/td>\u003ctd>Responds to requests, and starts an election if it hears no leader\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Candidate\u003c/td>\u003ctd>Increments the term, votes for itself and requests votes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Leader\u003c/td>\u003ctd>Handles client writes, replicates the log and sends \u003ca href=\"#Heartbeat\" data-term=\"Heartbeat\">heartbeats\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Time is divided into numbered terms, and each term has at most one leader. A follower whose randomized election timeout expires becomes a candidate. It wins with votes from a majority \u003ca href=\"#Quorum\" data-term=\"Quorum\">quorum\u003c/a>, and each node casts at most one vote per term, recorded on disk. A voter refuses any candidate whose log is less up to date than its own, so a new leader always holds every committed entry.\u003c/p>\u003cp>The leader appends each command to its log and sends it to followers with AppendEntries messages, which include the index and term of the preceding entry so followers can reject mismatches. An entry from the current term is committed once a majority stores it. Entries from earlier terms become committed only indirectly, when a later entry from the current term commits. Committed entries are applied in order, as in \u003ca href=\"#State%20machine%20replication\" data-term=\"State machine replication\">state machine replication\u003c/a>.\u003c/p>\u003cp>A common operational problem is election churn. If disk or network latency delays heartbeats past the election timeout, followers keep starting elections, and writes stall even though every node is up. Raising the timeout or moving the log to a faster disk usually helps.\u003c/p>\u003cp>A deposed leader may not know it has been replaced, so linearizable reads must confirm leadership first.\u003c/p>","avoid":"","usage":["etcd keeps logging leader changes, but all three members are up.","Check disk sync latency. If the disk stalls, Raft heartbeats miss the election timeout and followers call new elections."],"out":[38,40,1,8,29,28]},{"name":"Leader election","section":4,"description":"The process by which a group of nodes chooses one to coordinate work, and replaces it when it fails.","body":"\u003cp>The process by which a group of \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> chooses one member to coordinate work, and chooses a replacement when that member fails. A single leader can order writes, assign tasks or run a scheduled job without negotiating each decision.\u003c/p>\u003cp>An election protocol has two goals. Safety means at most one leader is recognized for a given term (a numbered period of leadership). Liveness means that a leader is eventually chosen as long as enough nodes are working. \u003ca href=\"#FLP%20impossibility\" data-term=\"FLP impossibility\">FLP impossibility\u003c/a> means liveness cannot be guaranteed on a fully asynchronous network, so protocols depend on timeouts.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>How a leader is chosen\u003c/th>\u003cth>Safe under partition?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Consensus\" data-term=\"Consensus\">Consensus\u003c/a> vote\u003c/td>\u003ctd>A majority votes in a numbered term, as in \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a>\u003c/td>\u003ctd>Yes, one leader per term\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Coordination service\u003c/td>\u003ctd>Nodes compete for a \u003ca href=\"#Lease\" data-term=\"Lease\">lease\u003c/a> in a system such as etcd or ZooKeeper\u003c/td>\u003ctd>Yes, if stale leaders are fenced\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bully algorithm\u003c/td>\u003ctd>The highest-ID reachable node wins\u003c/td>\u003ctd>No, each side can elect its own\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Manual or static\u003c/td>\u003ctd>An operator or config file names the leader\u003c/td>\u003ctd>Depends on the operator\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A correct election does not ensure that only one node believes it is leader at every moment. A leader that pauses or loses contact can continue acting on an old belief while a new leader is elected. The guarantee is per term, and that gap is how \u003ca href=\"#Split%20brain\" data-term=\"Split brain\">split brain\u003c/a> reaches external systems. When a leader writes to shared storage, protect the write with a \u003ca href=\"#Fencing%20token\" data-term=\"Fencing token\">fencing token\u003c/a>, such as the term number.\u003c/p>\u003cp>Elections also cost availability. Between the old leader failing and a new one taking over, writes fail or hang, typically for the detection timeout plus the election itself. Timeouts set too aggressively cause repeated elections under load, when a \u003ca href=\"#Failure%20detector\" data-term=\"Failure detector\">failure detector\u003c/a> mistakes slowness for failure.\u003c/p>","avoid":"","usage":["The cron job ran twice last night, once on each scheduler.","The old scheduler was paused during the handover and woke up still thinking it led. The job needs a fencing check."],"out":[1,39,38,41,43,10,45,9]},{"name":"Lease","section":4,"description":"A time-limited grant of a right or resource, which expires automatically unless the holder renews it.","body":"\u003cp>A time-limited grant of a right, such as being leader or holding a lock, that expires automatically unless the holder renews it. Cary Gray and David Cheriton described leases in 1989 for file cache consistency. If a \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> holding an ordinary lock crashes, the lock may never be released. A lease ends on its own.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Holder\u003c/td>\u003ctd>Records its local time, then requests a lease of duration D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Grantor\u003c/td>\u003ctd>Grants the lease and starts timing D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Holder\u003c/td>\u003ctd>Works, and renews well before D runs out\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Holder\u003c/td>\u003ctd>Stops work if it cannot renew by its local expiry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Grantor\u003c/td>\u003ctd>After D plus a safety margin, may grant the lease to another node\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The holder starts counting before sending its request, so its expiry falls earlier than the grantor's. This keeps the two views safe without synchronized wall clocks, provided \u003ca href=\"#Clock%20drift\" data-term=\"Clock drift\">clock drift\u003c/a> stays below an assumed bound. Durations should use a monotonic clock (a timer that only moves forward).\u003c/p>\u003cp>Lease duration is a trade-off. A short lease recovers faster after a crash but needs more renewal traffic and is easier to lose in a brief stall.\u003c/p>\u003cp>A paused holder can outlive its lease. A process checks its lease, sees it is valid, and is then paused by garbage collection (the runtime halting the program to reclaim memory) or a VM migration. The lease expires, another node acquires it, and the first process wakes and carries on with its write. No check inside the process can close this gap, since the pause can land right after the check. Protecting the resource takes a \u003ca href=\"#Fencing%20token\" data-term=\"Fencing token\">fencing token\u003c/a>.\u003c/p>","avoid":"","usage":["Worker A's lease expired during a long GC pause, and it still wrote to the bucket.","A lease can't stop that by itself. The storage layer has to reject stale holders, so let's add a fencing token."],"out":[1,12,45]},{"name":"Distributed lock","section":4,"description":"A lock shared across machines so only one holder acts at a time. It cannot guarantee that alone when holders can pause.","body":"\u003cp>A lock that coordinates processes on different machines, so that only one of them works on a resource at a time. Because a holder can crash without releasing it, a distributed lock is almost always implemented as a \u003ca href=\"#Lease\" data-term=\"Lease\">lease\u003c/a> that expires. That expiry is the source of its main weakness: a holder can lose the lock without knowing.\u003c/p>\u003cp>The typical incident looks like this. Worker A acquires the lock and stalls, perhaps in a garbage collection pause (the runtime halting to reclaim memory). Its lease expires. Worker B acquires the lock and starts writing. Worker A resumes, still believing it holds the lock, and also writes. The same job has run twice or a file is corrupted, even though the locking code contains no bug.\u003c/p>\u003cp>The right lock depends on its purpose:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Purpose\u003c/th>\u003cth>If two holders overlap\u003c/th>\u003cth>Suitable approach\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Efficiency\u003c/td>\u003ctd>Some work is duplicated\u003c/td>\u003ctd>A simple lock, such as Redis \u003ccode>SET key value NX PX ttl\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Correctness\u003c/td>\u003ctd>Data is corrupted or money is lost\u003c/td>\u003ctd>A \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a>-backed lock in etcd or ZooKeeper, plus a \u003ca href=\"#Fencing%20token\" data-term=\"Fencing token\">fencing token\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A lock on a single \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> is unavailable or lost if that node fails, and failover with asynchronous replication can grant the same lock twice. A consensus-backed service avoids that but cannot stop a paused client. Only the protected resource can, by rejecting stale requests.\u003c/p>\u003cp>Give each acquisition a unique value and release only if the stored value still matches, or a slow worker can delete a lock now held by someone else. Where possible, avoid the lock altogether by using \u003ca href=\"#Idempotency\" data-term=\"Idempotency\">idempotency\u003c/a> or a compare-and-set write (a write that succeeds only if the value is unchanged), which puts the check at the resource.\u003c/p>","avoid":"","usage":["We put a Redis lock around the invoice job and still got duplicates.","A lock only narrows that window. If the worker pauses past the expiry, two can run. Make the invoice insert idempotent."],"out":[43,38,45,1,51]},{"name":"Fencing token","section":4,"description":"An increasing number issued with each lock grant, letting a resource reject writes from a holder that has been replaced.","body":"\u003cp>A number that increases with every grant of a \u003ca href=\"#Lease\" data-term=\"Lease\">lease\u003c/a> or lock, which the holder attaches to each request to the protected resource. The resource remembers the highest token it has seen and rejects anything lower. This stops a former holder that does not yet know it has been replaced.\u003c/p>\u003cp>Fencing addresses the gap that a \u003ca href=\"#Distributed%20lock\" data-term=\"Distributed lock\">distributed lock\u003c/a> cannot close on its own, because a client can pause at any moment and resume after its lease has expired:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Actor\u003c/th>\u003cth>Action\u003c/th>\u003cth>Storage's highest token\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Client 1\u003c/td>\u003ctd>Acquires lock, receives token 33\u003c/td>\u003ctd>32\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Client 1\u003c/td>\u003ctd>Pauses, and its lease expires\u003c/td>\u003ctd>32\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Client 2\u003c/td>\u003ctd>Acquires lock, receives token 34\u003c/td>\u003ctd>32\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Client 2\u003c/td>\u003ctd>Writes with token 34, accepted\u003c/td>\u003ctd>34\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Client 1\u003c/td>\u003ctd>Resumes, writes with token 33, rejected\u003c/td>\u003ctd>34\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Without step 5's check, Client 1 would overwrite Client 2's work, and neither client would see an error.\u003c/p>\u003cp>Two requirements make this work. The tokens must come from a source that never gives one number to two holders or goes backward, which in practice means a system built on \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a>. A \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a> term, an etcd revision and a ZooKeeper transaction ID (zxid) are common sources. The resource must also perform the comparison and the write atomically, because a separate check followed by a write reopens the race.\u003c/p>\u003cp>The second requirement is the practical limit. Fencing needs the resource to participate, and many do not. A database can do it with a conditional update such as \u003ccode>UPDATE ... WHERE fence_token &lt;= 34\u003c/code>. A third-party API usually cannot, so for those calls use an \u003ca href=\"#Idempotency\" data-term=\"Idempotency\">idempotency\u003c/a> key (a unique ID that lets the receiver discard repeats) and accept that the protection is weaker.\u003c/p>","avoid":"","usage":["The old leader came back after the pause and overwrote the new leader's output.","Nothing was checking who was current. Pass the term as a fencing token and have storage reject anything lower than it's seen."],"out":[43,44,38,41,51]},{"name":"Two-phase commit","section":5,"description":"A protocol that makes a transaction commit on all participants or none, but can block if the coordinator fails.","body":"\u003cp>A protocol that makes a transaction across several \u003ca href=\"#Node\" data-term=\"Node\">nodes\u003c/a> either commit on all of them or abort on all of them. One node acts as coordinator and the others are participants. It is often shortened to 2PC, and differs from two-phase locking, a technique for isolating concurrent transactions.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Coordinator\u003c/td>\u003ctd>Sends prepare to all participants\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Participant\u003c/td>\u003ctd>Durably records its changes and vote, keeps its locks, and replies yes or no\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Coordinator\u003c/td>\u003ctd>Decides commit if all voted yes, otherwise abort, and records the decision durably\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Coordinator\u003c/td>\u003ctd>Sends the decision to all participants\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Participant\u003c/td>\u003ctd>Applies the decision, releases locks and acknowledges\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A yes vote is binding. The participant must be able to commit even after a crash and restart, and it may not decide alone.\u003c/p>\u003cp>That promise creates the protocol's known weakness. If the coordinator fails after participants vote yes but before they hear the decision, they are in doubt. They cannot commit, because another participant may have voted no. They cannot abort, because the coordinator may have decided to commit. So they wait, holding locks, and other transactions touching those rows queue behind them. The symptom is a table that appears frozen with no active query to blame, until the coordinator recovers or an operator intervenes.\u003c/p>\u003cp>2PC is not a \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a> protocol in the fault-tolerant sense. It requires every participant to respond, so one failure can stop progress, where consensus needs only a majority. A common remedy combines the two: each participant and the coordinator are replicated with \u003ca href=\"#Paxos\" data-term=\"Paxos\">Paxos\u003c/a> or \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a>, so that a single machine failure cannot leave a transaction stuck. Spanner uses this design. \u003ca href=\"#Three-phase%20commit\" data-term=\"Three-phase commit\">Three-phase commit\u003c/a> tried a different remedy.\u003c/p>","avoid":"","usage":["This table has been locked for an hour, but nothing's running.","Check pg_prepared_xacts. It's likely an in-doubt two-phase commit whose coordinator died. Get the outcome from the coordinator's log before resolving it."],"out":[1,38,40,41,47]},{"name":"Three-phase commit","section":5,"description":"A variant of two-phase commit that avoids blocking under crash failures, but can break atomicity during a partition.","body":"\u003cp>A variant of \u003ca href=\"#Two-phase%20commit\" data-term=\"Two-phase commit\">two-phase commit\u003c/a> that adds a phase to avoid blocking when the coordinator crashes. Dale Skeen proposed it in the early 1980s. It is often shortened to 3PC.\u003c/p>\u003cp>Two-phase commit blocks because a participant that voted yes cannot tell whether anyone has already committed. Three-phase commit removes that uncertainty by inserting a step between voting and committing:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phase\u003c/th>\u003cth>Coordinator\u003c/th>\u003cth>Participants\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1. CanCommit\u003c/td>\u003ctd>Asks whether each can commit\u003c/td>\u003ctd>Vote yes or no\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2. PreCommit\u003c/td>\u003ctd>If all voted yes, announces the intent to commit\u003c/td>\u003ctd>Record the pre-commit state and acknowledge\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3. DoCommit\u003c/td>\u003ctd>After all acknowledge, tells them to commit\u003c/td>\u003ctd>Commit and acknowledge\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The added phase creates a useful invariant: no participant commits until every participant has voted yes and has been told so. If the coordinator crashes, the surviving participants can elect a new one and inspect their states. If any of them reached pre-commit, every participant voted yes, so they can finish the commit. If none did, nobody can have committed, so they can safely abort.\u003c/p>\u003cp>That recovery requires \u003ca href=\"#Crash%20failure\" data-term=\"Crash failure\">crash failures\u003c/a> only, bounded message delays, and a reliable \u003ca href=\"#Failure%20detector\" data-term=\"Failure detector\">failure detector\u003c/a>, so that a slow \u003ca href=\"#Node\" data-term=\"Node\">node\u003c/a> is never mistaken for a dead one.\u003c/p>\u003cp>Under a \u003ca href=\"#Network%20partition\" data-term=\"Network partition\">network partition\u003c/a>, the protocol can break atomicity, its main guarantee. Suppose participants that received pre-commit end up on one side and the rest on the other. The first group commits, the second sees no pre-commit and aborts, and the transaction ends up committed on some nodes and aborted on others. Two-phase commit would have blocked here and preserved atomicity.\u003c/p>\u003cp>Production systems that need non-blocking commit usually run two-phase commit over groups replicated with \u003ca href=\"#Consensus\" data-term=\"Consensus\">consensus\u003c/a>, using \u003ca href=\"#Paxos\" data-term=\"Paxos\">Paxos\u003c/a> or \u003ca href=\"#Raft\" data-term=\"Raft\">Raft\u003c/a>.\u003c/p>","avoid":"","usage":["Couldn't we switch to three-phase commit so a dead coordinator stops blocking us?","Only if the network never partitions. Otherwise each side can decide differently. Replicating the coordinator with Raft is safer."],"out":[46,5,9,1,3,38,40,41]},{"name":"At-most-once delivery","section":5,"description":"A guarantee that a message is processed zero or one times. It is never duplicated, but it can be lost.","body":"\u003cp>A delivery guarantee in which each message is processed zero or one times. A message is never handled twice, but it can be lost. The sender makes one attempt, or the receiver records progress before doing the work, so that a failure leaves the message unprocessed and nothing tries again.\u003c/p>\u003cp>The guarantee is a consequence of the same ambiguity behind every \u003ca href=\"#Partial%20failure\" data-term=\"Partial failure\">partial failure\u003c/a>. If a sender gets no acknowledgment, it cannot know whether the message arrived. It must choose between resending, which risks a duplicate, and not resending, which risks a loss. At-most-once chooses not to resend. \u003ca href=\"#At-least-once%20delivery\" data-term=\"At-least-once delivery\">At-least-once delivery\u003c/a> makes the opposite choice.\u003c/p>\u003cp>In a message queue, the order of two consumer steps determines which guarantee you get:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>At-most-once consumer\u003c/th>\u003cth>If it crashes right after this step\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Receives the message\u003c/td>\u003ctd>Message is redelivered, nothing lost\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Commits its position\u003c/td>\u003ctd>Message is lost, because it counts as done\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Processes the message\u003c/td>\u003ctd>Work is complete\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The symptom is a gap: a queue dashboard shows everything consumed and no errors, yet some records never reached the destination, often clustered around a deployment or crash. Auto-commit settings in consumer libraries can produce this behavior without anyone having chosen it, since the position may be committed on a timer while work is still in progress.\u003c/p>\u003cp>At-most-once suits data where a small loss costs less than a duplicate or a retry: high-volume metrics, debug logs, telemetry samples, or live position updates that the next message replaces anyway.\u003c/p>\u003cp>It does not suit payments, orders, or anything that must eventually happen. If a loss is unacceptable, use at-least-once delivery with \u003ca href=\"#Idempotency\" data-term=\"Idempotency\">idempotency\u003c/a>, which together produce \u003ca href=\"#Exactly-once%20semantics\" data-term=\"Exactly-once semantics\">exactly-once semantics\u003c/a>.\u003c/p>","avoid":"","usage":["We lost about forty events during the last deploy, but the consumer shows no errors.","It auto-commits offsets before processing finishes, so that's at-most-once delivery. Commit after the work is done."],"out":[2,49,51,50]},{"name":"At-least-once delivery","section":5,"description":"A guarantee that a message is retried until acknowledged. It will not be lost, but it may be processed more than once.","body":"\u003cp>A delivery guarantee in which a message is retried until the receiver acknowledges it. As long as the sender keeps running or has stored the message durably, and the receiver eventually recovers, the message is not lost. It may be processed more than once, which is the trade-off against \u003ca href=\"#At-most-once%20delivery\" data-term=\"At-most-once delivery\">at-most-once delivery\u003c/a>.\u003c/p>\u003cp>Duplicates are an inherent part of this guarantee, because of \u003ca href=\"#Partial%20failure\" data-term=\"Partial failure\">partial failure\u003c/a>. When an acknowledgment is lost, the sender cannot distinguish that case from the message itself being lost, so it sends again:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Sender\u003c/td>\u003ctd>Stores the message and sends it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Receiver\u003c/td>\u003ctd>Processes
