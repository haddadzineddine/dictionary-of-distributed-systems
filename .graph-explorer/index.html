 the message\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Receiver\u003c/td>\u003ctd>Sends an acknowledgment, which is lost or never sent because of a crash\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Sender\u003c/td>\u003ctd>Times out with no acknowledgment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Sender\u003c/td>\u003ctd>Resends the message\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Receiver\u003c/td>\u003ctd>Processes the same message a second time\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The result is a recognizable class of bug: a customer gets two confirmation emails, an account is charged twice, or a counter runs higher than the true value. These often appear in clusters after a deployment or a broker failover, when many in-flight messages are redelivered together.\u003c/p>\u003cp>The fix belongs in the receiver. Make processing safe to repeat through \u003ca href=\"#Idempotency\" data-term=\"Idempotency\">idempotency\u003c/a>, typically by recording each message ID in the same database transaction as the work. This combination is how systems usually achieve \u003ca href=\"#Exactly-once%20semantics\" data-term=\"Exactly-once semantics\">exactly-once semantics\u003c/a>.\u003c/p>\u003cp>Retries introduce two other problems. A malformed message that always fails will be redelivered forever and can block a queue, so after a limited number of attempts it should move to a dead-letter queue (a holding area for messages needing inspection). Retries can also reorder messages, so consumers that depend on order must check a version or sequence number.\u003c/p>","avoid":"","usage":["A few customers got the shipping email twice after last night's broker restart.","The queue is at-least-once, so redelivery is expected. The email worker needs to dedupe on message ID."],"out":[48,2,51,50]},{"name":"Exactly-once semantics","section":5,"description":"Each message's effect is applied once, usually by combining retries with deduplication or an atomic commit.","body":"\u003cp>A processing guarantee in which the effect of each message is applied exactly once, even if the message is transmitted several times. Over an unreliable network, no protocol can ensure that a message is physically delivered exactly once, because a sender that gets no acknowledgment cannot tell whether the message or the reply was lost. What systems can provide is an outcome equivalent to one delivery.\u003c/p>\u003cp>The standard construction is \u003ca href=\"#At-least-once%20delivery\" data-term=\"At-least-once delivery\">at-least-once delivery\u003c/a> plus a mechanism that makes repeats harmless. Retries ensure nothing is lost, and the receiver ensures duplicates have no further effect:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technique\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Boundary of the guarantee\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Idempotency\" data-term=\"Idempotency\">Idempotency\u003c/a>\u003c/td>\u003ctd>The receiver records message IDs and ignores repeats\u003c/td>\u003ctd>Wherever the IDs are stored\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Atomic position and result\u003c/td>\u003ctd>Result and consumer position commit in one database transaction\u003c/td>\u003ctd>That one database\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Broker transactions\u003c/td>\u003ctd>Kafka's transactions commit output messages and consumer offsets together\u003c/td>\u003ctd>Topics within that Kafka cluster\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Every technique has a boundary, and bugs often come from crossing it. A stream processor may advertise exactly-once, and within its own state and topics that claim holds. If a handler also sends an email or calls a payment API, that side effect sits outside the transaction. When the handler crashes and is re-run, the email goes out again.\u003c/p>\u003cp>For an external call, pass an idempotency key that the third party honors. If it offers none, you must choose between possibly repeating the action and possibly missing it, as with any \u003ca href=\"#Partial%20failure\" data-term=\"Partial failure\">partial failure\u003c/a>.\u003c/p>\u003cp>Deduplication has limits. IDs are kept for a retention window, so a message redelivered after it is processed again. The ID check and the effect must also commit atomically, or a crash between them produces a duplicate or a loss.\u003c/p>","avoid":"","usage":["Kafka is set to exactly-once, so why did the webhook fire twice?","That guarantee stops at Kafka. The webhook is an external side effect, so it needs its own idempotency key."],"out":[49,51,2]},{"name":"Idempotency","section":5,"description":"The property that performing an operation several times has the same effect as performing it once.","body":"\u003cp>The property that performing an operation several times has the same effect as performing it once. In a \u003ca href=\"#Distributed%20system\" data-term=\"Distributed system\">distributed system\u003c/a>, it makes retries safe. A timed-out request may or may not have been applied, as in any \u003ca href=\"#Partial%20failure\" data-term=\"Partial failure\">partial failure\u003c/a>, and the client can resend it without knowing which.\u003c/p>\u003cp>Whether an operation is idempotent depends on how it is expressed:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Operation\u003c/th>\u003cth>Idempotent?\u003c/th>\u003cth>Why\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>SET balance = 100\u003c/code>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Repeating leaves the same value\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>balance = balance + 10\u003c/code>\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Each repeat adds 10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>DELETE WHERE id = 7\u003c/code>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>The row stays gone\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>INSERT\u003c/code> with a generated ID\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Each repeat creates a row\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>INSERT\u003c/code> with a client-chosen ID and a unique constraint\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Repeats are rejected or ignored\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Other operations can use an idempotency key, a unique ID the client generates once per logical operation and reuses on every retry. The server stores the key with the result, and on a repeat it returns that result and skips the work. Without this, a double-clicked pay button can charge a customer twice.\u003c/p>\u003cp>The key and the effect must commit in one transaction, or a crash between them breaks the guarantee. Concurrent retries can both pass a &quot;have I seen this?&quot; check, so enforce uniqueness with a database constraint. Keys are eventually deleted, so the retention period must exceed the longest time a client might retry.\u003c/p>\u003cp>Idempotent does not mean safe to replay at any time. If \u003ccode>SET x = 1\u003c/code> is delayed and retried after another client has run \u003ccode>SET x = 2\u003c/code>, the retry undoes the newer write. Guarding against that takes a version check or a \u003ca href=\"#Fencing%20token\" data-term=\"Fencing token\">fencing token\u003c/a>.\u003c/p>\u003cp>Idempotency is the receiver's half of \u003ca href=\"#Exactly-once%20semantics\" data-term=\"Exactly-once semantics\">exactly-once semantics\u003c/a>, paired with \u003ca href=\"#At-least-once%20delivery\" data-term=\"At-least-once delivery\">at-least-once delivery\u003c/a>.\u003c/p>","avoid":"","usage":["The mobile client retries on timeout, and we're seeing duplicate orders.","The create endpoint isn't idempotent. Have the client send a key and put a unique constraint on it."],"out":[0,2,45,50,49]}]}
    </script>
    <script>
      (() => {
        const data = JSON.parse(
          document.getElementById("graph-data").textContent
        );
        const $ = (id) => document.getElementById(id);
        const stage = $("stage");
        const panel = $("panel");
        const panelBody = $("panel-body");
        const resizer = $("resizer");
        const search = $("search");
        const input = $("search-input");
        const results = $("results");
        const info = $("info");
        const infoBtn = $("info-btn");
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

        const INK = "#1c1c1a";
        const BG = "#ededE9";
        // Hubs keep their label even when it crosses another circle.
        const HUB_WEIGHT = 0.7;
        const esc = (s) =>
          s.replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
          );
        const hashFor = (name) => "#" + encodeURIComponent(name);

        const nodes = data.terms.map((term, i) => ({
          ...term,
          id: i,
          incoming: [],
        }));
        const links = [];
        const linkKeys = new Set();
        nodes.forEach((n) =>
          n.out.forEach((t) => {
            nodes[t].incoming.push(n.id);
            links.push({ source: n.id, target: t, from: n.id, to: t });
            linkKeys.add(n.id + ">" + t);
          })
        );
        // A two-way pair is drawn as one line; both directions keep their particles.
        links.forEach((l) => {
          l.hiddenTwin = l.from > l.to && linkKeys.has(l.to + ">" + l.from);
        });

        const maxIncoming = Math.max(...nodes.map((n) => n.incoming.length), 1);
        const sectionCount = data.sections.length;
        const stageBox = stage.getBoundingClientRect();
        const landscape = stageBox.width >= stageBox.height;
        const anchorRadiusX = landscape ? 360 : 170;
        const anchorRadiusY = landscape ? 190 : 320;
        nodes.forEach((n, i) => {
          const weight = Math.sqrt(n.incoming.length / maxIncoming);
          const shade = Math.round(214 - weight * 158);
          n.weight = weight;
          n.r = 4 + Math.sqrt(n.incoming.length) * 2.9;
          n.fill = `rgb(${shade},${shade},${shade - 3})`;
          n.neighbors = new Set([n.id, ...n.out, ...n.incoming]);
          const angle = (n.section / sectionCount) * Math.PI * 2;
          n.anchorX = sectionCount > 1 ? Math.cos(angle) * anchorRadiusX : 0;
          n.anchorY = sectionCount > 1 ? Math.sin(angle) * anchorRadiusY : 0;
          n.x = n.anchorX + Math.cos(i * 2.4) * (30 + i);
          n.y = n.anchorY + Math.sin(i * 2.4) * (30 + i);
        });
        const byName = new Map(nodes.map((n) => [n.name, n]));

        let selected = null;
        let hovered = null;
        let userMoved = false;
        let pauseTimer = 0;
        let particleFocus = null;
        // The selected term keeps the highlight; hovering only adds to it.
        const focusNode = () => selected || hovered;
        const isVisible = (n, f) =>
          !f || f.neighbors.has(n.id) || n === hovered;
        const endpoint = (v) => (typeof v === "object" ? v.id : v);
        const isFocusLink = (l) => {
          const f = focusNode();
          return (
            !!f && (endpoint(l.source) === f.id || endpoint(l.target) === f.id)
          );
        };

        function collideForce() {
          let all = [];
          const force = () => {
            for (let i = 0; i < all.length; i++) {
              for (let j = i + 1; j < all.length; j++) {
                const a = all[i],
                  b = all[j];
                const dx = b.x - a.x || 0.01,
                  dy = b.y - a.y || 0.01;
                const d = Math.hypot(dx, dy);
                const min = a.r + b.r + 9;
                if (d >= min) continue;
                const push = ((min - d) / d) * 0.5;
                b.x += dx * push;
                b.y += dy * push;
                a.x -= dx * push;
                a.y -= dy * push;
              }
            }
          };
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function sectionForce() {
          let all = [];
          const force = (alpha) =>
            all.forEach((n) => {
              n.vx += (n.anchorX - n.x) * 0.035 * alpha;
              n.vy += (n.anchorY - n.y) * 0.035 * alpha;
            });
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function drawNode(n, ctx, k) {
          const near = isVisible(n, focusNode());
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          if (!near) {
            // An opaque base stops lines showing through dimmed circles.
            ctx.fillStyle = BG;
            ctx.fill();
          }
          ctx.globalAlpha = near ? 1 : 0.15;
          ctx.fillStyle = n.fill;
          ctx.fill();
          ctx.globalAlpha = 1;
          if (n === selected) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 3.2 / Math.max(k, 0.6), 0, Math.PI * 2);
            ctx.strokeStyle = INK;
            ctx.lineWidth = 1.4 / k;
            ctx.stroke();
          }
        }

        function drawLabels(ctx, k) {
          const f = focusNode();
          const rank = (n) =>
            (n === hovered
              ? 4
              : n === f
                ? 3
                : f && f.neighbors.has(n.id)
                  ? 2
                  : 0) + n.weight;
          const placed = [];
          const order = nodes
            .filter((n) => isVisible(n, f))
            .sort((a, b) => rank(b) - rank(a));
          const hitsCircle = (box, self) =>
            order.some((m) => {
              if (m === self) return false;
              const cx = Math.max(box.l, Math.min(m.x, box.r));
              const cy = Math.max(box.t, Math.min(m.y, box.b));
              return Math.hypot(m.x - cx, m.y - cy) < m.r;
            });
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.lineJoin = "round";
          for (const n of order) {
            const pinned = n === f || n === hovered;
            const px = n === f ? 15 : n === hovered ? 13 : 8.5 + n.weight * 5.5;
            const size = px / k;
            ctx.font = `${size}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
            if ("letterSpacing" in ctx) ctx.letterSpacing = `${size * 0.06}px`;
            const text = n.name.toUpperCase();
            const w = ctx.measureText(text).width;
            const y = n.y - n.r - 5 / k;
            const box = {
              l: n.x - w / 2 - 3 / k,
              r: n.x + w / 2 + 3 / k,
              t: y - size - 1 / k,
              b: y + 1 / k,
            };
            if (
              !pinned &&
              ((n.weight < HUB_WEIGHT && hitsCircle(box, n)) ||
                placed.some(
                  (p) =>
                    box.l < p.r && box.r > p.l && box.t < p.b && box.b > p.t
                ))
            )
              continue;
            placed.push(box);
            ctx.globalAlpha = 0.9;
            ctx.strokeStyle = BG;
            ctx.lineWidth = 3.5 / k;
            ctx.strokeText(text, n.x, y);
            ctx.globalAlpha = pinned ? 1 : f ? 0.82 : 0.38 + n.weight * 0.55;
            ctx.fillStyle = INK;
            ctx.fillText(text, n.x, y);
          }
          ctx.globalAlpha = 1;
          if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
        }

        const graph = new ForceGraph($("graph"))
          .backgroundColor("rgba(0,0,0,0)")
          .nodeId("id")
          .nodeLabel(() => "")
          .nodeCanvasObject(drawNode)
          .nodePointerAreaPaint((n, color, ctx) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 2, 0, Math.PI * 2);
            ctx.fill();
          })
          .linkColor((l) => {
            if (l.hiddenTwin) return "rgba(0,0,0,0)";
            if (!focusNode()) return "rgba(28,28,26,.09)";
            return isFocusLink(l) ? "rgba(28,28,26,.5)" : "rgba(28,28,26,.025)";
          })
          .linkWidth((l) => (isFocusLink(l) ? 0.9 : 0.5))
          .linkDirectionalParticles((l) =>
            !reducedMotion.matches && isFocusLink(l) ? 2 : 0
          )
          .linkDirectionalParticleWidth(2.2)
          .linkDirectionalParticleSpeed(0.005)
          .linkDirectionalParticleColor(() => INK)
          .minZoom(0.25)
          .maxZoom(6)
          .warmupTicks(280)
          .cooldownTicks(70)
          .onRenderFramePost(drawLabels)
          .onNodeClick((n) => go(n.name))
          .onBackgroundClick(() => go(null))
          .onNodeHover((n) => {
            hovered = n || null;
            wake();
          })
          .onNodeDragEnd((n) => {
            n.fx = undefined;
            n.fy = undefined;
          })
          .onZoom((t) => {
            if (t && programmaticUntil < performance.now()) userMoved = true;
          });

        graph.d3Force("charge").strength(-340).distanceMax(760);
        graph
          .d3Force("link")
          .distance((l) => 46 + l.source.r + l.target.r)
          .strength(
            (l) =>
              0.55 / Math.min(l.source.neighbors.size, l.target.neighbors.size)
          );
        graph.d3Force("collide", collideForce());
        graph.d3Force("section", sectionForce());
        graph.graphData({ nodes, links });

        let programmaticUntil = 0;
        const camera = (ms) => {
          programmaticUntil = performance.now() + ms + 80;
        };

        function fitAll(ms = 0) {
          camera(ms);
          graph.zoomToFit(ms, 54);
        }

        function focusCamera(ms = 650) {
          if (!selected) return;
          const box = stage.getBoundingClientRect();
          let reach = selected.r;
          selected.neighbors.forEach((id) => {
            const m = nodes[id];
            reach = Math.max(
              reach,
              Math.hypot(m.x - selected.x, m.y - selected.y) + m.r
            );
          });
          const k = Math.min(
            2.2,
            Math.max(0.5, (Math.min(box.width, box.height) / 2 - 40) / reach)
          );
          camera(ms);
          graph.centerAt(selected.x, selected.y, ms);
          graph.zoom(k, ms);
        }

        function wake() {
          const f = focusNode();
          if (f !== particleFocus) {
            particleFocus = f;
            // force-graph only rebuilds particles when this prop is set.
            graph.linkDirectionalParticles((l) =>
              !reducedMotion.matches && isFocusLink(l) ? 2 : 0
            );
          }
          graph.autoPauseRedraw(false);
          clearTimeout(pauseTimer);
          if (!focusNode() || reducedMotion.matches) {
            pauseTimer = setTimeout(() => graph.autoPauseRedraw(true), 160);
          }
        }

        function renderPanel(n) {
          const chip = (id) =>
            `<a class="chip" href="${hashFor(nodes[id].name)}" data-term="${esc(nodes[id].name)}">${esc(nodes[id].name)}</a>`;
          const linkedFrom = n.incoming.filter((id) => !n.out.includes(id));
          panelBody.innerHTML = `
            <div class="eyebrow">${esc(data.sections[n.section])}</div>
            <h1 tabindex="-1">${esc(n.name)}</h1>
            ${n.description ? `<p class="lede">${esc(n.description)}</p>` : ""}
            ${n.usage.length ? `<section class="block"><span class="label">${esc(data.labels.quotes)}</span>
              <div class="bubbles">${n.usage.map((u) => `<div class="bubble">${u}</div>`).join("")}</div>
            </section>` : ""}
            ${n.avoid ? `<section class="block"><span class="label">${esc(data.labels.note)}</span><p class="avoid">${n.avoid}</p></section>` : ""}
            ${n.out.length ? `<section class="block"><span class="label">${esc(data.labels.outgoing)}</span><div class="chips">${n.out.map(chip).join("")}</div></section>` : ""}
            ${linkedFrom.length ? `<section class="block"><span class="label">${esc(data.labels.incoming)}</span><div class="chips">${linkedFrom.map(chip).join("")}</div></section>` : ""}
            ${n.body ? `<section class="block"><details><summary><span class="label">${esc(data.labels.body)}</span></summary><div class="entry">${n.body}</div></details></section>` : ""}`;
          panel.scrollTop = 0;
        }

        function applyHash({ moveFocus = false } = {}) {
          let name = "";
          try {
            name = decodeURIComponent(location.hash.slice(1));
          } catch {
            name = "";
          }
          selected = byName.get(name) || null;
          hovered = null;
          $("hint").hidden = !!selected;
          document.body.classList.toggle("has-selection", !!selected);
          document.title = selected
            ? `${selected.name} — ${data.title}`
            : `${data.title} — Graph`;
          if (selected) {
            renderPanel(selected);
            panel.hidden = false;
            if (moveFocus)
              panelBody.querySelector("h1").focus({ preventScroll: true });
          } else {
            panel.hidden = true;
          }
          resizer.hidden = !selected;
          syncResizer();
          resize();
          if (selected) focusCamera();
          else if (graphReady) {
            userMoved = false;
            fitAll(600);
          }
          wake();
        }

        function go(name) {
          closePopovers();
          const next = name ? hashFor(name) : "";
          if (location.hash === next) {
            if (name) focusCamera();
            return;
          }
          location.hash = next;
        }

        function resize() {
          const box = stage.getBoundingClientRect();
          graph.width(Math.round(box.width)).height(Math.round(box.height));
        }

        const PANEL_MIN = 300;
        const STAGE_MIN = 320;
        const PANEL_WIDTH_KEY = `graph-explorer:${data.title}:panel-width`;
        let preferredWidth = readPanelWidth();
        let resizing = false;
        let grabOffset = 0;

        function readPanelWidth() {
          try {
            const value = Number(localStorage.getItem(PANEL_WIDTH_KEY));
            return Number.isFinite(value) && value > 0 ? value : null;
          } catch {
            return null;
          }
        }

        function savePanelWidth() {
          try {
            if (preferredWidth === null)
              localStorage.removeItem(PANEL_WIDTH_KEY);
            else localStorage.setItem(PANEL_WIDTH_KEY, String(preferredWidth));
          } catch {
            // Storage can be unavailable; the width still applies this visit.
          }
        }

        const maxPanelWidth = () => Math.max(PANEL_MIN, innerWidth - STAGE_MIN);
        const clampPanelWidth = (width) =>
          Math.round(Math.min(maxPanelWidth(), Math.max(PANEL_MIN, width)));

        function syncResizer() {
          resizer.setAttribute("aria-valuemin", String(PANEL_MIN));
          resizer.setAttribute("aria-valuemax", String(maxPanelWidth()));
          if (!panel.hidden) {
            resizer.setAttribute(
              "aria-valuenow",
              String(Math.round(panel.getBoundingClientRect().width))
            );
          }
        }

        // The saved width is kept as-is so it returns when the window grows.
        function applyPanelWidth() {
          const root = document.documentElement;
          if (preferredWidth === null)
            root.style.removeProperty("--panel-width");
          else
            root.style.setProperty(
              "--panel-width",
              `${clampPanelWidth(preferredWidth)}px`
            );
          syncResizer();
        }

        function setPanelWidth(width) {
          preferredWidth = clampPanelWidth(width);
          applyPanelWidth();
        }

        function endResize() {
          if (!resizing) return;
          resizing = false;
          document.body.classList.remove("resizing");
          savePanelWidth();
          focusCamera(200);
        }

        resizer.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          resizer.setPointerCapture(e.pointerId);
          grabOffset = e.clientX - panel.getBoundingClientRect().left;
          resizing = true;
          document.body.classList.add("resizing");
        });
        resizer.addEventListener("pointermove", (e) => {
          if (!resizing) return;
          const right = $("app").getBoundingClientRect().right;
          setPanelWidth(right - (e.clientX - grabOffset));
        });
        resizer.addEventListener("pointerup", endResize);
        resizer.addEventListener("pointercancel", endResize);
        resizer.addEventListener("lostpointercapture", endResize);
        resizer.addEventListener("dblclick", () => {
          preferredWidth = null;
          applyPanelWidth();
          savePanelWidth();
        });
        resizer.addEventListener("keydown", (e) => {
          const step = e.shiftKey ? 64 : 24;
          const current = panel.getBoundingClientRect().width;
          const next = {
            ArrowLeft: current + step,
            ArrowRight: current - step,
            Home: PANEL_MIN,
            End: maxPanelWidth(),
          }[e.key];
          if (next === undefined) return;
          e.preventDefault();
          setPanelWidth(next);
          savePanelWidth();
        });
        window.addEventListener("resize", applyPanelWidth);
        applyPanelWidth();

        new ResizeObserver(() => {
          resize();
          if (selected) focusCamera(resizing ? 0 : 250);
          else if (graphReady && !userMoved) fitAll(0);
          wake();
        }).observe(stage);

        function closePopovers() {
          search.hidden = true;
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
        }

        let matches = [];
        let active = 0;

        function renderResults() {
          const q = input.value.trim().toLowerCase();
          const score = (n) => {
            const name = n.name.toLowerCase();
            if (!q) return 3;
            if (name === q) return 0;
            if (name.startsWith(q)) return 1;
            if (name.includes(q)) return 2;
            return n.description.toLowerCase().includes(q) ? 3 : 9;
          };
          matches = nodes
            .filter((n) => score(n) < 9)
            .sort(
              (a, b) => score(a) - score(b) || a.name.localeCompare(b.name)
            );
          active = Math.min(active, Math.max(matches.length - 1, 0));
          results.innerHTML = matches.length
            ? matches
                .map(
                  (n, i) =>
                    `<li id="result-${i}" role="option" aria-selected="${i === active}" data-name="${esc(n.name)}">${esc(n.name)}<small>${esc(n.description)}</small></li>`
                )
                .join("")
            : `<li class="none">No matching ${esc(data.nouns)}</li>`;
          if (matches.length) {
            input.setAttribute("aria-activedescendant", `result-${active}`);
            $(`result-${active}`).scrollIntoView({ block: "nearest" });
          } else input.removeAttribute("aria-activedescendant");
        }

        function openSearch() {
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
          search.hidden = false;
          input.value = "";
          active = 0;
          renderResults();
          input.focus();
        }

        function pick(name) {
          go(name);
          requestAnimationFrame(() => {
            const heading = panelBody.querySelector("h1");
            if (heading) heading.focus({ preventScroll: true });
          });
        }

        input.addEventListener("input", () => {
          active = 0;
          renderResults();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (!matches.length) return;
            active =
              (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) %
              matches.length;
            renderResults();
          } else if (e.key === "Enter" && matches[active]) {
            e.preventDefault();
            pick(matches[active].name);
          }
        });
        results.addEventListener("mousedown", (e) => e.preventDefault());
        results.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-name]");
          if (li) pick(li.dataset.name);
        });

        $("search-btn").addEventListener("click", () =>
          search.hidden ? openSearch() : closePopovers()
        );
        infoBtn.addEventListener("click", () => {
          const open = info.hidden;
          closePopovers();
          info.hidden = !open;
          infoBtn.setAttribute("aria-expanded", String(open));
        });
        $("close").addEventListener("click", () => go(null));
        $("info-counts").textContent =
          `${nodes.length} ${nodes.length === 1 ? data.noun : data.nouns}, ${links.length} ${links.length === 1 ? "link" : "links"}, ${data.sections.length} ${data.sections.length === 1 ? "group" : "groups"}.`;

        panel.addEventListener("mouseover", (e) => {
          const a = e.target.closest("[data-term]");
          const next = a ? byName.get(a.dataset.term) || null : null;
          if (next !== hovered) {
            hovered = next;
            wake();
          }
        });
        panel.addEventListener("mouseleave", () => {
          hovered = null;
          wake();
        });

        document.addEventListener("keydown", (e) => {
          const typing = /^(INPUT|TEXTAREA)$/.test(
            document.activeElement?.tagName || ""
          );
          if (
            (e.key === "/" && !typing) ||
            (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))
          ) {
            e.preventDefault();
            openSearch();
          } else if (e.key === "Escape") {
            if (!search.hidden || !info.hidden) {
              const fromSearch = !search.hidden;
              closePopovers();
              if (fromSearch) $("search-btn").focus();
            } else if (selected) go(null);
          }
        });

        window.addEventListener("hashchange", () =>
          applyHash({ moveFocus: true })
        );

        let graphReady = false;
        resize();
        setTimeout(() => {
          graphReady = true;
          if (location.hash.length > 1) applyHash();
          else fitAll(0);
        }, 60);
      })();
    </script>
  </body>
</html>
